<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas 395 — chargement</title>
<style>html,body{margin:0;background:#080c13;color:#eef3ff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;font-size:16px;letter-spacing:.02em}</style>
</head>
<body>
<div class="loading">Chargement d’Atlas 395…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html',{cache:'no-store'});
    if(!r.ok)throw new Error(`index ${r.status}`);
    let html=await r.text();
    html=html.replace(/href="\/styles\.css[^\"]*"/,'href="./githack.css?v=20260817-1745"');
    html=html.replace(/<script src="\/app\.js[^\"]*" defer><\/script>/,'<script src="./githack.js?v=20260817-1745" defer><\/script>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading">Atlas 395 ne peut pas être chargé.</div>';console.error(e)}
})();
</script>
</body>
</html>
