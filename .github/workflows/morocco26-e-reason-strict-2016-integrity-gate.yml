name: morocco26-e-reason-strict-2016-integrity-gate
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_audit_strict_2016_integrity_gate.py"
      - "morocco26/data/goal100/e_reason/evidence/strict_2016_ifrane_sidi_crossmodal_candidates/evidence.json"
      - "morocco26/data/goal100/e_reason/evidence/strict_2016_ifrane_sidi_embedded_name_diagnostic/diagnostic.json"
      - ".github/workflows/morocco26-e-reason-strict-2016-integrity-gate.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-strict-2016-integrity-gate
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_audit_strict_2016_integrity_gate.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit strict integrity gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/strict_2016_integrity_gate/gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze strict 2016 integrity gate"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
