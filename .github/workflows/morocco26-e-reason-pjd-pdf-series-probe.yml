name: morocco26-e-reason-pjd-pdf-series-probe
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_probe_pjd_missing_pdf_series.py"
      - ".github/workflows/morocco26-e-reason-pjd-pdf-series-probe.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-pjd-pdf-series-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 pypdf==5.9.0
      - name: Probe deterministic PDF-series neighbors
        env:
          E_REASON_PJD_SERIES_RUN_ID: pjd_series_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_probe_pjd_missing_pdf_series.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit discovery-only probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pjd_2016_pdf_series_probe \
                  morocco26/data/goal100/e_reason/pjd_2016_pdf_series_probe_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive deterministic PJD PDF-series probe"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
