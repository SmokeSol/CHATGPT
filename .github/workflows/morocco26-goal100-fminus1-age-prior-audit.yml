name: morocco26-goal100-fminus1-age-prior-audit

on:
  push:
    branches: [morocco26-fminus1]
    paths:
      - 'morocco26/scripts/goal100_fminus1_age_prior_audit.py'
      - '.github/workflows/morocco26-goal100-fminus1-age-prior-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy
      - name: Replay and audit every binding statutory tie
        run: python morocco26/scripts/goal100_fminus1_age_prior_audit.py
