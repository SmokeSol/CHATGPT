name: morocco26-goal100-fminus1-tie-diagnostic

on:
  push:
    branches: [morocco26-fminus1]
    paths:
      - 'morocco26/scripts/goal100_run_fminus1_diagnostic_v3.py'
      - '.github/workflows/morocco26-goal100-fminus1-tie-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy
      - name: Emit first persistent statutory-tie diagnostic
        run: python morocco26/scripts/goal100_run_fminus1_diagnostic_v3.py
