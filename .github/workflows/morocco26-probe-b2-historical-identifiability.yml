name: morocco26-probe-b2-historical-identifiability

on:
  push:
    branches: [morocco26-fminus1-run]
    paths:
      - 'morocco26/scripts/goal100_probe_b2_historical_identifiability.py'
      - '.github/workflows/morocco26-probe-b2-historical-identifiability.yml'
  workflow_dispatch:

concurrency:
  group: morocco26-probe-b2-historical-identifiability-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      B2_BRANCH: morocco26-b2-structured-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for B2 phase-open certificate
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin --prune
            if git ls-remote --exit-code --heads origin "$B2_BRANCH" >/dev/null 2>&1; then
              git switch -C "$B2_BRANCH" "origin/$B2_BRANCH"
              if [ -f morocco26/data/goal100/b2/v1/b2_phase_open_certificate.json ]; then
                python - <<'PY'
                import json
                from pathlib import Path
                c=json.loads(Path('morocco26/data/goal100/b2/v1/b2_phase_open_certificate.json').read_text(encoding='utf-8'))
                raise SystemExit(0 if c.get('gate')=='PASS_B2_OPEN_NOT_FROZEN' else 1)
                PY
                if [ "$?" -eq 0 ]; then exit 0; fi
              fi
            fi
            git switch -C morocco26-fminus1-run origin/morocco26-fminus1-run >/dev/null 2>&1 || true
            echo "Waiting for B2 phase-open certificate: $attempt/120"
            sleep 10
          done
          exit 1

      - name: Import historical identifiability probe
        run: git checkout origin/morocco26-fminus1-run -- morocco26/scripts/goal100_probe_b2_historical_identifiability.py

      - name: Execute identifiability probe
        run: python morocco26/scripts/goal100_probe_b2_historical_identifiability.py

      - name: Validate honest block and task count
        run: |
          python morocco26/scripts/validate_anti_drift.py
          python morocco26/scripts/goal100_validate_b2_v1.py
          python - <<'PY'
          import csv, json
          from pathlib import Path
          b=Path('morocco26/data/goal100/b2/v1')
          p=json.loads((b/'historical_identifiability_probe.json').read_text(encoding='utf-8'))
          assert p['gate']=='BLOCKED_HISTORICAL_FEATURE_BACKFILL_REQUIRED'
          assert p['common_local_territories']==92
          assert p['forecast_transitions_available']==['2011_TO_2016','2016_TO_2021']
          assert p['predictive_features_with_nonzero_historical_coverage']==[]
          assert p['historical_backfill_tasks']==1932
          assert p['scientific_consequence']['non_legal_B2_coefficients']=='MUST_REMAIN_ZERO'
          with (b/'historical_backfill_queue.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1932 and all(r['status']=='OPEN_MISSING' for r in rows)
          residual=json.loads((b/'b2_residual_backtest.json').read_text(encoding='utf-8'))
          assert residual['gate']=='BLOCKED_HISTORICAL_FEATURE_BACKFILL_REQUIRED'
          assert residual['non_legal_coefficients']=='ALL_ZERO'
          assert residual['F0_unlocked'] is False
          print('B2_HISTORICAL_IDENTIFIABILITY_PROBE_PASS')
          PY

      - name: Commit probe and backfill queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            morocco26/data/goal100/b2/v1/historical_identifiability_probe.json \
            morocco26/data/goal100/b2/v1/historical_backfill_queue.csv \
            morocco26/data/goal100/b2/v1/b2_residual_backtest.json \
            morocco26/scripts/goal100_probe_b2_historical_identifiability.py \
            morocco26/FIL_D_ARIANE.md \
            morocco26/FIL_ARIANE.md 2>/dev/null || true
          git commit -m 'research(morocco26): certify B2 historical feature backfill gap' || true
          for attempt in 1 2 3; do
            git fetch origin "$B2_BRANCH"
            git rebase "origin/$B2_BRANCH" || { git rebase --abort; exit 1; }
            if git push origin HEAD:"$B2_BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Print scientific result
        run: cat morocco26/data/goal100/b2/v1/historical_identifiability_probe.json
