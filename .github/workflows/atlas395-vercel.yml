name: Atlas 395 — Vercel production

on:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/web/**'
      - 'morocco26/vercel.json'
      - '.github/workflows/atlas395-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN_PRESENT=false'
            echo 'A repository secret named VERCEL_TOKEN is required for CLI deployment.'
            exit 3
          fi
          echo 'VERCEL_TOKEN_PRESENT=true'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link or create Atlas 395 project
        working-directory: morocco26
        shell: bash
        run: |
          set -euo pipefail
          vercel project add atlas-395 --token="$VERCEL_TOKEN" --yes >/tmp/vercel-project-add.log 2>&1 || true
          cat /tmp/vercel-project-add.log
          vercel link --yes --project atlas-395 --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: production
        working-directory: morocco26
        shell: bash
        run: |
          set -euo pipefail
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "VERCEL_URL=$url" >> "$GITHUB_ENV"
          echo "## Atlas 395 — Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete institutional interface
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$VERCEL_URL" > /tmp/vercel-dom.html
          grep -Fq 'Synthèse nationale' /tmp/vercel-dom.html
          grep -Fq 'Méthodologie' /tmp/vercel-dom.html
          grep -Fq 'Carte territoriale' /tmp/vercel-dom.html
          grep -Fq 'Partis' /tmp/vercel-dom.html
          grep -Fq 'Signaux 2026' /tmp/vercel-dom.html
          grep -Fq 'Historique' /tmp/vercel-dom.html
          grep -Fq 'Une projection territoriale, probabiliste et traçable' /tmp/vercel-dom.html
          grep -Fq 'Neutralité et gouvernance des données' /tmp/vercel-dom.html
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|tester l.IA|IA contre référence|mettre l.IA' /tmp/vercel-dom.html
          ! grep -Fq 'Atlas 395 ne peut pas charger les données' /tmp/vercel-dom.html
          ! grep -Fq 'Atlas 395 ne peut pas initialiser cette édition' /tmp/vercel-dom.html
          echo "VERIFIED_VERCEL_URL=$VERCEL_URL"
