name: morocco26-goal75-regional-national-sum
on:
  push:
    branches: [morocco26-goal75-hard]
    paths: ['.github/workflows/morocco26-goal75-regional-national-sum.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - run: PYTHONPATH=morocco26/scripts python morocco26/scripts/goal75_regional_national_sum_audit.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal75/regional_national_sum_audit.json
          git commit -m "data(morocco26): record regional national vote-sum audit"
          git pull --rebase origin morocco26-goal75-hard
          git push origin HEAD:morocco26-goal75-hard
