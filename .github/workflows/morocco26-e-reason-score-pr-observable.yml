name: Morocco26 E_reason observable locked holdout score

on:
  pull_request:
    branches: [morocco26-e-reason]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  score-locked-holdout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen base branch
        uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - name: Install numerical runtime
        run: python -m pip install --disable-pip-version-check --quiet numpy
      - name: Download sealed mapping after C2 freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('morocco26/data/goal100/e_reason/blind/holdout/mapping_artifact_locator.json').read_text())['artifact_id'])
          PY
          )
          mkdir -p "$RUNNER_TEMP/e_reason_mapping"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/mapping.zip"
          unzip -q "$RUNNER_TEMP/mapping.zip" -d "$RUNNER_TEMP/e_reason_mapping"
      - name: Score frozen 2021 holdout
        env:
          MAPPING_PATH: ${{ runner.temp }}/e_reason_mapping/holdout_mapping.json
          E_REASON_SCORE_OUTPUT: ${{ runner.temp }}/e_reason_score_v1.json
        run: python morocco26/scripts/e_reason_score_holdout_2021_v1.py
      - name: Upload immutable score output
        uses: actions/upload-artifact@v4
        with:
          name: e-reason-2021-locked-score-v1
          path: ${{ runner.temp }}/e_reason_score_v1.json
          retention-days: 90
          if-no-files-found: error
