name: morocco26-goal75-p2-exact-g
on:
  push:
    branches: [morocco26-goal75-hard]
    paths: ['.github/workflows/morocco26-goal75-p2-exact-g.yml']
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - run: python morocco26/scripts/goal75_p2_exact.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal75/local_2021_replay_exact.json morocco26/data/goal75/regional_2021_replay_exact.json morocco26/data/goal75/seat_margin_92.json morocco26/data/goal75/p2_exact_audit.json
          git commit -m "data(morocco26): close exact 92+12 legal replay gate"
          git pull --rebase origin morocco26-goal75-hard
          git push origin HEAD:morocco26-goal75-hard
