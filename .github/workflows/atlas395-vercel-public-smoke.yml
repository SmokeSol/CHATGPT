name: Atlas 395 — Verify Vercel public interface

on:
  push:
    branches: [atlas395-v0]
    paths:
      - '.github/workflows/atlas395-vercel-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Find and verify public Vercel production domain
        shell: bash
        run: |
          set -uo pipefail
          candidates=(
            'https://atlas395-maroc-2026.vercel.app/'
            'https://atlas395-maroc-2026-yannlevy85gmailcoms-projects.vercel.app/'
            'https://atlas395-maroc-2026-8hnny7air-yannlevy85gmailcoms-projects.vercel.app/'
          )
          PUBLIC=''
          for URL in "${candidates[@]}"; do
            echo "=== $URL ==="
            code=$(curl -sS -L -o /tmp/candidate.html -w '%{http_code}' --max-time 30 "$URL" || true)
            title=$(grep -o '<title>[^<]*' /tmp/candidate.html | head -1 || true)
            echo "HTTP=$code TITLE=$title BYTES=$(wc -c < /tmp/candidate.html)"
            if grep -Fq 'ATLAS 395' /tmp/candidate.html; then PUBLIC="$URL"; break; fi
          done
          test -n "$PUBLIC" || { echo 'NO_PUBLIC_VERCEL_DOMAIN'; exit 1; }
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "$PUBLIC" > /tmp/atlas-dom.html
          grep -Fq 'Synthèse nationale' /tmp/atlas-dom.html
          grep -Fq 'Méthodologie' /tmp/atlas-dom.html
          grep -Fq 'Carte territoriale' /tmp/atlas-dom.html
          grep -Fq 'Partis' /tmp/atlas-dom.html
          grep -Fq 'Signaux 2026' /tmp/atlas-dom.html
          grep -Fq 'Historique' /tmp/atlas-dom.html
          grep -Fq 'Une projection territoriale, probabiliste et traçable' /tmp/atlas-dom.html
          grep -Fq 'Neutralité et gouvernance des données' /tmp/atlas-dom.html
          grep -Fq '50 000' /tmp/atlas-dom.html
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|tester l.IA|IA contre référence|mettre l.IA' /tmp/atlas-dom.html
          ! grep -Fq 'Édition temporairement indisponible' /tmp/atlas-dom.html
          echo "VERIFIED_PUBLIC_VERCEL_URL=$PUBLIC"
