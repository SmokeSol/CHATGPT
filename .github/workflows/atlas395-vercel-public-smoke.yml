name: Atlas 395 — Verify Vercel public interface

on:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/web/**'
      - '.github/workflows/atlas395-vercel-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Find the current public Atlas V1 deployment
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            'https://atlas-395-v1-yannlevy85gmailcoms-projects.vercel.app/'
            'https://atlas-395-v1-hgfuufv1n-yannlevy85gmailcoms-projects.vercel.app/'
            'https://atlas-395-rescue-20260817.vercel.app/'
            'https://atlas395-maroc-2026.vercel.app/'
          )
          PUBLIC=''
          for attempt in $(seq 1 24); do
            echo "Poll ${attempt}/24"
            for URL in "${candidates[@]}"; do
              code=$(curl -sS -L -o /tmp/candidate.html -w '%{http_code}' --max-time 35 "$URL" || true)
              bytes=$(wc -c < /tmp/candidate.html 2>/dev/null || echo 0)
              echo "$URL HTTP=$code BYTES=$bytes"
              if [ "$code" = '200' ] && grep -Fq 'ATLAS 395' /tmp/candidate.html && grep -Fq '/api/atlas-v1' /tmp/candidate.html && grep -Fq 'Arabic Native' /tmp/candidate.html; then
                PUBLIC="$URL"
                break 2
              fi
            done
            sleep 10
          done
          test -n "$PUBLIC" || { echo 'NO_PUBLIC_ATLAS_V1_DEPLOYMENT'; exit 1; }
          echo "PUBLIC=$PUBLIC" >> "$GITHUB_ENV"
          echo "VERIFIED_PUBLIC_VERCEL_URL=$PUBLIC" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify same-origin APIs and immutable evidence payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 "${PUBLIC}api/atlas-v1" -o /tmp/atlas_v1.json
          curl -fsSL --max-time 60 "${PUBLIC}api/national" -o /tmp/national.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/atlas_v1.json').read_text(encoding='utf-8'))
          national = json.loads(Path('/tmp/national.json').read_text(encoding='utf-8'))
          coverage = data['coverage']
          assert data['forecast']['immutable'] is True
          assert data['forecast']['candidate_and_signal_impact'] == 'NOT_CALIBRATED'
          assert coverage['canonical_local_territories'] == 92
          assert coverage['arabic_identity_coverage'] == 92
          assert coverage['candidate_records_after_official_pjd_merge'] == 546
          assert coverage['local_territories_with_records_after_merge'] == 92
          assert coverage['missing_after_merge'] == []
          assert len(data['territories']) == 92
          assert len({r['constituency_id'] for r in data['territories']}) == 92
          assert any(r['name_ar'] == 'الدار البيضاء آنفا' for r in data['territories'])
          assert len(data['pjd_bilingual_roster']) == 92
          assert national['snapshot_id'] == 'F0'
          assert national['draws'] == 50000
          assert national['total_seats'] == 395
          print(json.dumps(coverage, indent=2, ensure_ascii=False))
          PY

      - name: Verify rendered Atlas V1 in Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=35000 --dump-dom "$PUBLIC" > /tmp/atlas-dom.html
          grep -Fq 'Synthèse' /tmp/atlas-dom.html
          grep -Fq 'Candidatures' /tmp/atlas-dom.html
          grep -Fq 'Territoires' /tmp/atlas-dom.html
          grep -Fq 'Partis' /tmp/atlas-dom.html
          grep -Fq 'Méthode' /tmp/atlas-dom.html
          grep -Fq 'Audit' /tmp/atlas-dom.html
          grep -Fq 'Candidatures et identité territoriale 2026' /tmp/atlas-dom.html
          grep -Fq 'Projection gelée inchangée' /tmp/atlas-dom.html
          grep -Fq '546' /tmp/atlas-dom.html
          grep -Fq 'الدار البيضاء آنفا' /tmp/atlas-dom.html
          grep -Fq 'AUCUN DELTA' /tmp/atlas-dom.html
          ! grep -Fq 'Atlas ne peut pas charger cette édition' /tmp/atlas-dom.html
          echo "ATLAS_V1_BROWSER_SMOKE=PASS" >> "$GITHUB_STEP_SUMMARY"
