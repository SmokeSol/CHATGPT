name: morocco26-e-reason-wayback-diagnostic

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_wayback_diagnostic.py"
      - ".github/workflows/morocco26-e-reason-wayback-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-wayback-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4
      - name: Run diagnostic
        env:
          E_REASON_WAYBACK_RUN_ID: wayback_diagnostic_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_wayback_diagnostic.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/wayback_diagnostics \
                  morocco26/data/goal100/e_reason/wayback_diagnostic_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive Wayback diagnostic"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
