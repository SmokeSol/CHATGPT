name: morocco26-e-reason-ifrane-sidi-embedded-names
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_verify_ifrane_sidi_ifni_embedded_names.py"
      - "morocco26/data/goal100/e_reason/evidence/strict_2016_three_district_ocr_diagnostic/diagnostic.json"
      - ".github/workflows/morocco26-e-reason-ifrane-sidi-embedded-names.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - run: python morocco26/scripts/e_reason_verify_ifrane_sidi_ifni_embedded_names.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/strict_2016_ifrane_sidi_embedded_name_diagnostic/diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze Ifrane Sidi-Ifni cross-modal name diagnostic"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
