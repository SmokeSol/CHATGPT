name: Morocco26 Agent Society V2 vectorized population build

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/build_populations_vectorized.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84de285dc43e19b8f553872dba57cab1cb1c04ce
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 openpyxl==3.1.5 numpy==2.1.3
      - run: python morocco26/scripts/agent_society_v2_build_historical_populations_vectorized.py
      - name: Show certificate
        run: cat morocco26/data/goal100/agent_society_v2/population_certificate_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-historical-populations-vectorized-v1
          path: |
            morocco26/data/goal100/agent_society_v2/populations/*.json
            morocco26/data/goal100/agent_society_v2/population_certificate_v1.json
