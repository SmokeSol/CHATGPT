name: morocco26-e-reason-historical-collect

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_collect_historical.py"
      - "morocco26/data/goal100/e_reason/e_reason_source_seed_manifest_v1.json"
      - ".github/workflows/morocco26-e-reason-historical-collect.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-historical-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout E_reason branch
        uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frozen preregistration
        run: python morocco26/scripts/validate_e_reason_prereg.py

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4

      - name: Collect pre-cutoff historical evidence
        env:
          E_REASON_RUN_ID: historical_collection_${{ github.run_id }}_${{ github.run_attempt }}
          E_REASON_MAX_FETCHES: "350"
          E_REASON_MAX_DEPTH: "3"
          E_REASON_MAX_BYTES: "6000000"
        run: python morocco26/scripts/e_reason_collect_historical.py

      - name: Revalidate immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py

      - name: Inspect collection manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('morocco26/data/goal100/e_reason/historical_collection_latest.json').read_text())
          manifest = json.loads(Path(latest['latest_run_manifest']).read_text())
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          assert manifest['predictive_judgments_generated'] is False
          assert manifest['forecast_delta_generated'] is False
          assert manifest['F1_created'] is False
          assert manifest['immutable_artifacts_modified'] is False
          PY

      - name: Commit append-only collection results
        run: |
          if git diff --quiet -- morocco26/data/goal100/e_reason && \
             [ -z "$(git ls-files --others --exclude-standard morocco26/data/goal100/e_reason)" ]; then
            echo "No generated evidence to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence \
                  morocco26/data/goal100/e_reason/historical_collection_latest.json
          git commit -m "experiment(e-reason): archive pre-cutoff historical evidence"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
