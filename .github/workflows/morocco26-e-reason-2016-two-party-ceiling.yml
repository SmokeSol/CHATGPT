name: morocco26-e-reason-2016-two-party-ceiling
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_compute_2016_two_party_ceiling.py"
      - ".github/workflows/morocco26-e-reason-2016-two-party-ceiling.yml"
permissions:
  contents: write
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_compute_2016_two_party_ceiling.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit planning diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/2016_two_party_ceiling/ceiling.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze 2016 two-party identity ceiling"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
