name: Morocco26 Agent Society V2 geo crosswalk audit

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/geo_crosswalk.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-agent-society-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python morocco26/scripts/agent_society_v2_geo_crosswalk_feasibility.py
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-geo-crosswalk-feasibility
          path: morocco26/data/goal100/agent_society_v2/audits/geo_crosswalk_feasibility_v1.json
