name: Morocco26 Agent Society V2 build historical populations

on:
  push:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/build_historical_populations.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morocco26-agent-society-v2-build-historical-populations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: morocco26-agent-society-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 openpyxl==3.1.5 numpy==2.1.3
      - name: Build 2016 and 2021 empirical synthetic populations
        run: python morocco26/scripts/agent_society_v2_build_historical_populations.py
      - name: Inspect certificate
        run: cat morocco26/data/goal100/agent_society_v2/population_certificate_v1.json
      - name: Commit certified population artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/agent_society_v2/populations morocco26/data/goal100/agent_society_v2/population_certificate_v1.json
          git commit -m 'experiment(agent-society-v2): certify 2016 and 2021 synthetic populations' || exit 0
          git push origin HEAD:morocco26-agent-society-v2
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-historical-populations-v1
          path: |
            morocco26/data/goal100/agent_society_v2/populations/*.json
            morocco26/data/goal100/agent_society_v2/population_certificate_v1.json
