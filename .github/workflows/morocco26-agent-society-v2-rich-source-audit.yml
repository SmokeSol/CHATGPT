name: Morocco26 Agent Society V2 RICH source catalog
on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths: ['morocco26/data/goal100/agent_society_v2/runs/rich_source_audit_*']
permissions: {contents: read}
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install readers
        run: python -m pip install --disable-pip-version-check -q pyreadstat pandas openpyxl python-docx
      - name: Fetch frozen manifest and parser from this commit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; mkdir -p /tmp/asv2rich/raw /tmp/asv2rich/out /tmp/asv2rich/src; api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents"
          for item in "manifest.json:morocco26/data/goal100/agent_society_v2/asv2_rich_source_manifest_v1.json" "catalog.py:morocco26/scripts/agent_society_v2_rich_source_catalog.py"; do dst="${item%%:*}"; src="${item#*:}"; curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" "${api}/${src}?ref=${GITHUB_SHA}" -o "/tmp/asv2rich/src/${dst}"; done
      - name: Download all public source files in parallel
        run: |
          python - <<'PY'
          import json,subprocess,concurrent.futures,pathlib
          m=json.load(open('/tmp/asv2rich/src/manifest.json'));raw=pathlib.Path('/tmp/asv2rich/raw')
          def get(s):
           p=subprocess.run(['curl','-fL','--retry','3','--retry-delay','2','--connect-timeout','20','--max-time','900','-A','Mozilla/5.0 (ASV2 academic audit)',s['url'],'-o',str(raw/(s['id']+'.bin'))]);return s['id'],p.returncode
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
           for f in concurrent.futures.as_completed([ex.submit(get,s) for s in m['sources']]):print(f.result())
          PY
      - name: Build variable catalog and feasibility report
        run: python /tmp/asv2rich/src/catalog.py --manifest /tmp/asv2rich/src/manifest.json --rawdir /tmp/asv2rich/raw --outdir /tmp/asv2rich/out
      - name: Verify and stage attitude donors
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/asv2rich/raw/afrobarometer_morocco_r6.bin | cut -d' ' -f1)" = "1ab8a01626244a094e97f874791576cc40270f21d135183d2e4b25ab41fa5a8d"
          test "$(sha256sum /tmp/asv2rich/raw/afrobarometer_morocco_r8.bin | cut -d' ' -f1)" = "5e0c8c70bb9e8488eb51866ca225a0babd5fcbf33bc0441238f8688e01a265f3"
          mkdir -p /tmp/asv2rich/donors
          cp /tmp/asv2rich/raw/afrobarometer_morocco_r6.bin /tmp/asv2rich/donors/afro_r6.sav
          cp /tmp/asv2rich/raw/afrobarometer_morocco_r8.bin /tmp/asv2rich/donors/afro_r8.sav
          sha256sum /tmp/asv2rich/donors/* > /tmp/asv2rich/donors/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: asv2-rich-source-catalog-v2, path: /tmp/asv2rich/out/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: asv2-rich-afrobarometer-donors-v1, path: /tmp/asv2rich/donors/, retention-days: 90}
