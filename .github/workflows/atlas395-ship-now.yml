name: Atlas 395 — Ship complete app now

on:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/web/**'
      - '.github/workflows/atlas395-ship-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Atlas branch
        uses: actions/checkout@v4

      - name: Verify full app before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -f morocco26/web/index.html
          test -f morocco26/web/styles.css
          test -f morocco26/web/app.js
          test -f morocco26/web/assets/core.js
          test -f morocco26/web/assets/methodology.css
          test -f morocco26/web/data/current_snapshot.json
          test -f morocco26/web/data/public_methodology.json
          grep -q 'view-overview' morocco26/web/index.html
          grep -q 'view-methodology' morocco26/web/index.html
          grep -q 'view-territories' morocco26/web/index.html
          grep -q 'view-parties' morocco26/web/index.html
          grep -q 'view-signals' morocco26/web/index.html
          grep -q 'view-history' morocco26/web/index.html
          grep -q "\['methodology','Méthodologie'" morocco26/web/assets/core.js
          grep -q "load('public_methodology.json')" morocco26/web/assets/core.js
          grep -q 'Une projection territoriale, probabiliste et traçable' morocco26/web/app.js
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|agentic|E_collect|F0|F-1|B2_' morocco26/web/data/public_methodology.json

      - name: Package full reader app
        shell: bash
        run: |
          set -euo pipefail
          cd morocco26/web
          zip -qr /tmp/atlas395-full.zip . -x 'githack.html' 'githack.js' 'githack.css' 'data/methodology_state.json' 'editions/*/methodology_state.json'
          ! unzip -Z1 /tmp/atlas395-full.zip | grep -q '^data/methodology_state.json$'
          ! unzip -Z1 /tmp/atlas395-full.zip | grep -Eq '^editions/[^/]+/methodology_state.json$'
          unzip -Z1 /tmp/atlas395-full.zip | grep -q '^data/public_methodology.json$'

      - name: Publish full app
        id: ship
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST 'https://ship.page/deploy?ttl=604800' -H 'Content-Type: application/zip' --data-binary @/tmp/atlas395-full.zip)
          url=$(python -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$response")
          test -n "$url"
          echo "ATLAS_URL=$url" >> "$GITHUB_ENV"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published files and rendered interface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "${ATLAS_URL}data/public_methodology.json" -o /tmp/public_methodology.json
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|agentic|E_collect|F0|F-1|B2_' /tmp/public_methodology.json
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${ATLAS_URL}data/methodology_state.json")
          test "$code" = '404'
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$ATLAS_URL" > /tmp/live-dom.html
          grep -Fq 'Synthèse nationale' /tmp/live-dom.html
          grep -Fq 'Méthodologie' /tmp/live-dom.html
          grep -Fq 'Carte territoriale' /tmp/live-dom.html
          grep -Fq 'Partis' /tmp/live-dom.html
          grep -Fq 'Signaux 2026' /tmp/live-dom.html
          grep -Fq 'Historique' /tmp/live-dom.html
          grep -Fq 'Une projection territoriale, probabiliste et traçable' /tmp/live-dom.html
          grep -Fq 'Neutralité et gouvernance des données' /tmp/live-dom.html
          grep -Fq 'class="kpi hi"' /tmp/live-dom.html
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|tester l.IA|IA contre référence|mettre l.IA' /tmp/live-dom.html
          ! grep -Fq 'Atlas 395 ne peut pas charger les données' /tmp/live-dom.html
          ! grep -Fq 'Atlas 395 ne peut pas initialiser cette édition' /tmp/live-dom.html
          echo "VERIFIED_FULL_ATLAS_URL=$ATLAS_URL"
