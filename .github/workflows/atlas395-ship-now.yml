name: Atlas 395 — Ship institutional reader

on:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/web/**'
      - '.github/workflows/atlas395-ship-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete Atlas branch
        uses: actions/checkout@v4

      - name: Verify institutional reader before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -f morocco26/web/index.html
          test -f morocco26/web/styles.css
          test -f morocco26/web/app.js
          test -f morocco26/web/assets/core.js
          test -f morocco26/web/assets/candidates.js
          test -f morocco26/web/assets/candidates.css
          test -f morocco26/web/assets/methodology.css
          test -f morocco26/web/data/atlas_v1.json
          test -f morocco26/web/data/current_snapshot.json
          test -f morocco26/web/data/public_methodology.json
          grep -Fq 'Intelligence électorale territoriale · Maroc 2026' morocco26/web/index.html
          grep -Fq 'Rapport de forces et incertitude territoriale' morocco26/web/index.html
          grep -Fq 'Une projection territoriale, probabiliste et traçable' morocco26/web/index.html
          grep -Fq "['overview','Synthèse'" morocco26/web/assets/core.js
          grep -Fq "['signals','Veille 2026'" morocco26/web/assets/core.js
          grep -Fq 'Candidatures documentées par circonscription' morocco26/web/assets/candidates.js
          grep -Fq 'RÉFÉRENCE CONSERVÉE' morocco26/web/assets/candidates.js
          grep -Fq 'edition_date||ec?.edition_id' morocco26/web/assets/daily.js
          grep -Fq 'institutionalNavBound' morocco26/web/assets/institutional.js
          ! grep -Eiq 'LLM|intelligence artificielle|expérimentation IA|tester l.?IA|mettre l.?IA|IA contre référence|E_reason|E_full|agentic|Arabic Native|AUCUN DELTA APPLIQUÉ' morocco26/web/index.html morocco26/web/assets/candidates.js morocco26/web/data/public_methodology.json
          for js in morocco26/web/app.js morocco26/web/assets/core.js morocco26/web/assets/daily.js morocco26/web/assets/map.js morocco26/web/assets/candidates.js morocco26/web/assets/institutional.js; do node --check "$js"; done
          python - <<'PY'
          import json
          x=json.load(open('morocco26/web/data/atlas_v1.json',encoding='utf-8'))
          c=x['coverage']
          assert c['canonical_local_territories']==92
          assert c['arabic_identity_coverage']==92
          assert c['candidate_records_after_official_pjd_merge']==546
          assert c['local_territories_with_records_after_merge']==92
          assert c['missing_after_merge']==[]
          assert x['forecast']['immutable'] is True
          print('ATLAS_V1_DATA=PASS')
          PY

      - name: Package full reader app
        shell: bash
        run: |
          set -euo pipefail
          cd morocco26/web
          zip -qr /tmp/atlas395-institutional.zip . -x 'githack.html' 'githack.js' 'githack.css' 'data/methodology_state.json' 'editions/*/methodology_state.json'
          ! unzip -Z1 /tmp/atlas395-institutional.zip | grep -q '^data/methodology_state.json$'
          unzip -Z1 /tmp/atlas395-institutional.zip | grep -q '^data/atlas_v1.json$'
          unzip -Z1 /tmp/atlas395-institutional.zip | grep -q '^assets/candidates.js$'

      - name: Publish full institutional reader
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --retry 4 --retry-all-errors -fsS -X POST 'https://ship.page/deploy?ttl=604800' -H 'Content-Type: application/zip' --data-binary @/tmp/atlas395-institutional.zip)
          url=$(python -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$response")
          test -n "$url"
          echo "ATLAS_URL=$url" >> "$GITHUB_ENV"
          echo "TEMPORARY_VERIFIED_ATLAS_URL=$url" >> "$GITHUB_STEP_SUMMARY"
          echo "TEMPORARY_ATLAS_URL=$url"

      - name: Verify rendered institutional interface and navigation
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors -fsSL --max-time 40 "${ATLAS_URL}data/atlas_v1.json" -o /tmp/atlas_v1.json
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          dump(){ "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=35000 --dump-dom "$1"; }
          dump "$ATLAS_URL" > /tmp/live-dom.html
          python - <<'PY'
          from pathlib import Path
          dom=Path('/tmp/live-dom.html').read_text(encoding='utf-8',errors='replace')
          required=['Intelligence électorale territoriale · Maroc 2026','Rapport de forces et incertitude territoriale','Synthèse','Carte territoriale','Candidatures','Partis','Veille 2026','Méthode','Historique','Candidatures documentées par circonscription','RÉFÉRENCE CONSERVÉE','territoires bilingues','546','الدار البيضاء آنفا','data-institutional-nav-bound="1"']
          forbidden=['LLM','intelligence artificielle','expérimentation IA','E_reason','E_full','agentic','Arabic Native','AUCUN DELTA APPLIQUÉ','Invalid Date','NaN']
          missing=[x for x in required if x not in dom]
          forbidden_present=[x for x in forbidden if x.lower() in dom.lower()]
          fatal=[x for x in ['Atlas 395 ne peut pas charger','Atlas 395 ne peut pas initialiser'] if x in dom]
          assert '17 août 2026' in dom, 'reference date not rendered as 17 août 2026'
          print('MISSING_REQUIRED=',missing);print('FORBIDDEN_PRESENT=',forbidden_present);print('FATAL_PRESENT=',fatal)
          if missing or forbidden_present or fatal: raise SystemExit(1)
          print('INSTITUTIONAL_BROWSER_SMOKE=PASS')
          PY
          for view in overview territories candidates parties signals methodology history; do
            dump "${ATLAS_URL}#${view}" > "/tmp/${view}.html"
            python - "$view" <<'PY'
          import re,sys
          from pathlib import Path
          view=sys.argv[1]
          dom=Path(f'/tmp/{view}.html').read_text(encoding='utf-8',errors='replace')
          tag=re.search(rf'<section[^>]*id="view-{re.escape(view)}"[^>]*>',dom)
          if not tag: raise SystemExit(f'MISSING_VIEW={view}')
          if 'active' not in tag.group(0).split('class="',1)[-1].split('"',1)[0].split(): raise SystemExit(f'VIEW_NOT_ACTIVE={view}: {tag.group(0)}')
          if f'data-view="{view}"' not in dom: raise SystemExit(f'MISSING_TAB={view}')
          if 'Invalid Date' in dom: raise SystemExit(f'INVALID_DATE_IN_VIEW={view}')
          print(f'VIEW_PASS={view}')
          PY
          done
          echo "TAB_NAVIGATION_SMOKE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "REFERENCE_DATE_SMOKE=PASS" >> "$GITHUB_STEP_SUMMARY"
