name: morocco26-goal100-geometry-probe

on:
  push:
    branches: [morocco26-fminus1]
    paths:
      - 'morocco26/scripts/goal100_geometry_2026_probe.py'
      - '.github/workflows/morocco26-goal100-geometry-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - name: Probe current authoritative geometry sources
        run: python morocco26/scripts/goal100_geometry_2026_probe.py
      - name: Preserve Goal75 anti-drift checkpoint
        run: python morocco26/scripts/validate_anti_drift.py
      - name: Commit probe artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/geometry_2026_probe.json
          git commit -m 'data(morocco26): record authoritative geometry probe' || true
          git pull --rebase origin morocco26-fminus1
          git push origin HEAD:morocco26-fminus1
