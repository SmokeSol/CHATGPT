name: Extract Opus Agent Society frontend
on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/frontends/agent_society_opus/extract.trigger'
      - '.github/workflows/agent-society-opus-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archived Opus source verbatim
        shell: bash
        run: |
          set -euo pipefail
          SRC='morocco26/frontends/agent_society_opus/atlas-agentsociety-maroc.zip'
          DST='/tmp/opus-front'
          rm -rf "$DST"
          mkdir -p "$DST"
          unzip -q "$SRC" -d "$DST"
          find "$DST" -name '__MACOSX' -prune -exec rm -rf {} + || true
          find "$DST" -maxdepth 3 -type f -printf '%P\n' | sort > /tmp/opus-front-filelist.txt
          cat /tmp/opus-front-filelist.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opus-agent-society-frontend-source
          path: /tmp/opus-front/
          if-no-files-found: error
          retention-days: 7
