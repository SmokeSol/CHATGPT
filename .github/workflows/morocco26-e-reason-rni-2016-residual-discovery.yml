name: morocco26-e-reason-rni-2016-residual-discovery
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_discover_rni_2016_residual_candidates.py"
      - ".github/workflows/morocco26-e-reason-rni-2016-residual-discovery.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-rni-2016-residual-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Search only pre-cutoff official RNI posts for current 2-identity residual districts
        env:
          E_REASON_RNI2016_RUN_ID: rni2016_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_discover_rni_2016_residual_candidates.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit append-only RNI discovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/rni_2016_residual_discovery \
                  morocco26/data/goal100/e_reason/rni_2016_residual_discovery_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive bounded RNI 2016 residual discovery"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
