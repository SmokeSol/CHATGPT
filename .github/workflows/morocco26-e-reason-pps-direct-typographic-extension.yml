name: morocco26-e-reason-pps-direct-typographic-extension
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_parse_pps_2016_direct_typographic_extension.py"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity/direct_map.json"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_typographic_identities/parsed_identities.json"
      - ".github/workflows/morocco26-e-reason-pps-direct-typographic-extension.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-pps-direct-typographic-extension
  cancel-in-progress: true
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pdfplumber==0.11.7 pypdf==5.9.0
      - name: Parse safe direct-title pages outside base typographic subset
        run: python morocco26/scripts/e_reason_parse_pps_2016_direct_typographic_extension.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit additive direct-title typographic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pps_2016_direct_typographic_extension/extension.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze PPS direct-title typographic extension"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
