name: Morocco26 Agent Society V2 candidate-party gate

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/candidate_party_gate.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-agent-society-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python morocco26/scripts/agent_society_v2_candidate_party_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-candidate-party-coverage
          path: morocco26/data/goal100/agent_society_v2/audits/candidate_party_coverage_v1.json
