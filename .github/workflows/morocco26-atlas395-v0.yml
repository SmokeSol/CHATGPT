name: Atlas 395 — V0.5 Validation

on:
  workflow_dispatch:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/atlas395/**'
      - 'morocco26/scripts/atlas395_*.py'
      - 'morocco26/scripts/atlas395_daily_publish.sh'
      - 'morocco26/web/**'
      - '!morocco26/web/data/**'
      - '!morocco26/web/editions/**'
      - '.github/workflows/morocco26-atlas395-v0.yml'

permissions:
  contents: read

jobs:
  validate-product-and-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas395-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and reader interface syntax
        shell: bash
        run: |
          python -m py_compile morocco26/scripts/atlas395_*.py
          rm -rf morocco26/scripts/__pycache__
          node --check morocco26/web/app.js
          for f in morocco26/web/assets/*.js; do node --check "$f"; done
      - name: Smoke-test autonomous intake against certified source surface
        shell: bash
        run: |
          git fetch origin morocco26-b2:refs/remotes/origin/morocco26-b2
          git show origin/morocco26-b2:morocco26/data/goal100/b2_deterministic_acquisition_surface.json > /tmp/atlas395_surface_full.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/atlas395_surface_full.json'))
          keep={'T0_MAROC_MA_ELECTIONS','T1_PJD_OFFICIAL'}
          p['surfaces']=[x for x in p['surfaces'] if x.get('source_id') in keep]
          json.dump(p,open('/tmp/atlas395_surface.json','w'))
          PY
          python morocco26/scripts/atlas395_intake.py --surface /tmp/atlas395_surface.json --out /tmp/atlas395-intake --days-back 2 --max-per-source 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/atlas395-intake/latest.json').read_text())
          assert p['contract']['product_watch_only'] is True
          assert p['contract']['writes_science'] is False
          assert p['contract']['may_change_forecast'] is False
          assert p['active_sources_scanned'] > 0
          print('ATLAS395_INTAKE_CONTRACT_OK', p['active_sources_scanned'], p['detection_count'], p['probe_count'])
          PY
      - name: Check final-reader language surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('morocco26/web/index.html').read_text(encoding='utf-8').lower()
          forbidden = ['f-1','b2','unknown','locked','read only','github','monte carlo','llm','agentic','time machine']
          bad = [x for x in forbidden if x in html]
          if bad: raise SystemExit('Forbidden final-reader terms in HTML: ' + ', '.join(bad))
          print('ATLAS395_READER_LANGUAGE_OK')
          PY
      - name: Enforce no science mutation
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Validation changed tracked working-tree content:'
            git status --porcelain
            exit 1
          fi
          echo ATLAS395_VALIDATION_NO_MUTATION_OK
