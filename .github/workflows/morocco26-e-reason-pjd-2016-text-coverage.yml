name: morocco26-e-reason-pjd-2016-text-coverage

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_measure_pjd_2016_text_coverage.py"
      - ".github/workflows/morocco26-e-reason-pjd-2016-text-coverage.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-pjd-2016-text-coverage
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_measure_pjd_2016_text_coverage.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit coverage diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pjd_2016_text_coverage/coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze PJD 2016 recovered-slate coverage"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
