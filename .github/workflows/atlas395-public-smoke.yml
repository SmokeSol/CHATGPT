name: Atlas 395 — Public URL smoke test

on:
  push:
    branches: [atlas395-v0]
    paths:
      - 'morocco26/web/**'
      - '.github/workflows/atlas395-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete Atlas is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githack.com/SmokeSol/CHATGPT/atlas395-v0/morocco26/web'
          ok=0
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 20 "$BASE/githack.html" -o /tmp/githack.html \
              && curl -fsSL --max-time 20 "$BASE/index.html" -o /tmp/index.html \
              && curl -fsSL --max-time 20 "$BASE/githack.js" -o /tmp/githack.js \
              && curl -fsSL --max-time 20 "$BASE/githack.css" -o /tmp/githack.css \
              && curl -fsSL --max-time 20 "$BASE/assets/core.js" -o /tmp/core.js \
              && curl -fsSL --max-time 20 "$BASE/data/current_snapshot.json" -o /tmp/snapshot.json; then
              if grep -q 'view-methodology' /tmp/index.html \
                && grep -q "\['methodology','Méthodologie'" /tmp/core.js \
                && grep -q 'ATLAS_DATA_BASE' /tmp/githack.js \
                && grep -q './assets/methodology.css' /tmp/githack.css; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo "PUBLIC_URL=$BASE/githack.html" >> "$GITHUB_ENV"

      - name: Diagnose rendered Atlas in headless Chrome
        shell: bash
        run: |
          set -uo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 2
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$PUBLIC_URL" > /tmp/atlas-dom.html || true
          echo "DOM_BYTES=$(wc -c < /tmp/atlas-dom.html)"
          failed=0
          for marker in 'Synthèse nationale' 'Méthodologie' 'Carte territoriale' 'Partis' 'Signaux 2026' 'Historique' 'class="kpi hi"' '50 000'; do
            if grep -Fq "$marker" /tmp/atlas-dom.html; then echo "FOUND: $marker"; else echo "MISSING: $marker"; failed=1; fi
          done
          for bad in 'Atlas 395 ne peut pas charger les données' 'Atlas 395 ne peut pas initialiser cette édition' 'Atlas 395 ne peut pas être chargé'; do
            if grep -Fq "$bad" /tmp/atlas-dom.html; then echo "BAD_MARKER: $bad"; failed=1; fi
          done
          echo '--- DOM HEAD ---'
          head -c 4000 /tmp/atlas-dom.html || true
          echo
          echo '--- DOM TAIL ---'
          tail -c 4000 /tmp/atlas-dom.html || true
          echo
          exit "$failed"

      - name: Report URL
        if: always()
        run: echo "$PUBLIC_URL"
