name: Atlas 395 — Apply Source Policy Patch

on:
  push:
    branches: [atlas395-v0]
    paths:
      - '.bootstrap/atlas_policy_patch_*'
      - '.github/workflows/atlas395-apply-source-policy-patch.yml'

permissions:
  contents: write

concurrency:
  group: atlas395-source-policy-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas395-v0
          fetch-depth: 0
      - name: Reconstruct and apply reviewed source-policy patch
        shell: bash
        run: |
          (head -c 7000 .bootstrap/atlas_policy_patch_00
           cat .bootstrap/atlas_policy_patch_01 \
               .bootstrap/atlas_policy_patch_02 \
               .bootstrap/atlas_policy_patch_03) \
            | base64 -d > /tmp/atlas_policy_patch.tar.xz
          tar -xJf /tmp/atlas_policy_patch.tar.xz -C .
          chmod +x \
            morocco26/scripts/atlas395_intake.py \
            morocco26/scripts/atlas395_apply_intake.py \
            morocco26/scripts/atlas395_daily.py \
            morocco26/scripts/atlas395_daily_publish.sh \
            morocco26/scripts/validate_atlas395_views.py
          python -m py_compile morocco26/scripts/atlas395_*.py
          rm -rf morocco26/scripts/__pycache__
          node --check morocco26/web/assets/core.js
          node --check morocco26/web/assets/parties.js
          bash -n morocco26/scripts/atlas395_daily_publish.sh
          git rm .bootstrap/atlas_policy_patch_00 \
                 .bootstrap/atlas_policy_patch_01 \
                 .bootstrap/atlas_policy_patch_02 \
                 .bootstrap/atlas_policy_patch_03 \
                 .github/workflows/atlas395-apply-source-policy-patch.yml
          git add \
            .github/workflows/morocco26-atlas395-v0.yml \
            morocco26/atlas395/source_policy.json \
            morocco26/atlas395/release_manifest.json \
            morocco26/scripts/atlas395_intake.py \
            morocco26/scripts/atlas395_apply_intake.py \
            morocco26/scripts/atlas395_daily.py \
            morocco26/scripts/atlas395_daily_publish.sh \
            morocco26/scripts/validate_atlas395_views.py \
            morocco26/web/assets/core.js \
            morocco26/web/assets/parties.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[publish-policy] atlas395: enforce institutional sources and Medias24 only"
          git push origin HEAD:atlas395-v0
