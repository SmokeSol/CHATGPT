name: Morocco26 Agent Society V2 blind bundle schema probe

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/bundle_schema_probe.trigger'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91d36556c7a701d03aa06394b8f2eb1e025c8ef8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python morocco26/scripts/agent_society_v2_bundle_schema_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-society-v2-bundle-schema-probe
          path: morocco26/data/goal100/agent_society_v2/bundle_schema_probe_v1.json
