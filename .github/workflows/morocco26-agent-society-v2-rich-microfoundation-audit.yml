name: Morocco26 Agent Society V2 RICH microfoundation information audit

on:
  pull_request:
    branches:
      - morocco26-agent-society-v2

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install numerical stack
        run: python -m pip install --disable-pip-version-check -q pandas scipy scikit-learn
      - name: Fetch exact audit script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/asv2rich
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/morocco26/scripts/agent_society_v2_rich_microfoundation_audit.py?ref=${GITHUB_SHA}" -o /tmp/asv2rich/audit.py
      - name: Download exact HCP microdata sources in parallel
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 1200 -A 'Mozilla/5.0 (ASV2 academic audit)' https://www.rgph2014.hcp.ma/file/210749/ -o /tmp/asv2rich/individual.dta &
          p1=$!
          curl -fL --retry 3 --max-time 1200 -A 'Mozilla/5.0 (ASV2 academic audit)' https://www.rgph2014.hcp.ma/file/210748/ -o /tmp/asv2rich/household.dta &
          p2=$!
          wait $p1; wait $p2
          echo "62dbbfc69073d52841fc3a7096113ce1342a3baec2e7e620e0f3309393fdda77  /tmp/asv2rich/individual.dta" | sha256sum -c -
          echo "0c630cfaf65d02e1b2e37d8b81c0c2704f28db80115f13942d3ac0e75665319f  /tmp/asv2rich/household.dta" | sha256sum -c -
      - name: Measure joint-state richness
        run: |
          python /tmp/asv2rich/audit.py --individual /tmp/asv2rich/individual.dta --household /tmp/asv2rich/household.dta --out /tmp/asv2rich/microfoundation_information_audit_v1.json
      - name: Upload compact certificate
        uses: actions/upload-artifact@v4
        with:
          name: asv2-rich-microfoundation-information-audit-v1
          path: /tmp/asv2rich/microfoundation_information_audit_v1.json
          retention-days: 30
