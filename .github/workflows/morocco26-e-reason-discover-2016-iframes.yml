name: morocco26-e-reason-discover-2016-iframes
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_discover_2016_iframes.py"
      - ".github/workflows/morocco26-e-reason-discover-2016-iframes.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-discover-2016-iframes
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Discover iframe URLs
        env:
          E_REASON_IFRAME_RUN_ID: iframe_discovery_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_discover_2016_iframes.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/iframe_discovery morocco26/data/goal100/e_reason/iframe_discovery_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive 2016 iframe discovery"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
