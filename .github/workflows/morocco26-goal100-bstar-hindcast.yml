name: morocco26-goal100-bstar-hindcast
on:
  push:
    branches: [morocco26-goal100-p0]
    paths:
      - 'morocco26/data/goal100/forecast_protocol_v1.json'
      - 'morocco26/scripts/goal100_bstar_hindcast.py'
      - '.github/workflows/morocco26-goal100-bstar-hindcast.yml'
permissions:
  contents: write
jobs:
  hindcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal100-p0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet numpy
      - name: Execute frozen 2011->2016 fit / 2016->2021 validation
        run: python morocco26/scripts/goal100_bstar_hindcast.py
      - name: Preserve anti-drift constitution
        run: python morocco26/scripts/validate_anti_drift.py
      - name: Commit hindcast result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/bstar_hindcast_v1.json
          git commit -m 'data(morocco26): freeze Goal100 B-star hindcast result' || true
          git pull --rebase origin morocco26-goal100-p0
          git push origin HEAD:morocco26-goal100-p0
