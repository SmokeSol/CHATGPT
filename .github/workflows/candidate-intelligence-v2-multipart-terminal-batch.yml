name: Candidate Intelligence V2 Multipart Terminal Batch
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_multipart_head_power_gate_v3.py'
      - 'morocco26/scripts/candidate_intelligence_v2_multipart_predictive_gate_v1.py'
      - 'morocco26/scripts/candidate_intelligence_v2_terminal_certificate_v1.py'
      - '.github/workflows/candidate-intelligence-v2-multipart-terminal-batch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy requests pandas pyarrow
      - name: Multi-party power gate
        run: python morocco26/scripts/candidate_intelligence_v2_multipart_head_power_gate_v3.py
      - name: Multi-party predictive gate
        run: python morocco26/scripts/candidate_intelligence_v2_multipart_predictive_gate_v1.py
      - name: Terminal certificate
        run: python morocco26/scripts/candidate_intelligence_v2_terminal_certificate_v1.py
      - name: Show terminal result
        run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_terminal_certificate_v1.json
      - name: Commit batch results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_multipart_head_power_gate_v3.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2016_head_prior_mp_features_v3.jsonl
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2021_head_prior_mp_features_v3.jsonl
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2021_head_roster_dedup_v3.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_multipart_predictive_gate_v1.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_terminal_certificate_v1.json
          git commit -m 'result(candidate-intel): close multipart V2 gate' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin morocco26-e-reason &&
            git push origin HEAD:morocco26-e-reason && exit 0
            sleep 5
          done
          exit 1
