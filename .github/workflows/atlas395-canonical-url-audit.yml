name: Atlas 395 — Canonical Vercel URL audit

on:
  push:
    branches: [atlas395-v0]
    paths:
      - '.github/workflows/atlas395-canonical-url-audit.yml'
      - 'morocco26/web/**'
      - 'morocco26/vercel.json'
      - 'morocco26/scripts/atlas395_*.py'
      - 'morocco26/scripts/atlas395_*.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas395-vercel-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas395-v0
          fetch-depth: 0

      - name: Audit live Vercel deployment surface
        shell: bash
        run: python morocco26/scripts/atlas395_vercel_audit.py

      - name: Persist latest Vercel audit
        if: always()
        shell: bash
        run: |
          if [ ! -f morocco26/atlas395/vercel_audit_latest.json ]; then
            echo 'Audit result was not produced.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/atlas395/vercel_audit_latest.json
          if git diff --cached --quiet; then
            echo 'Vercel audit result unchanged.'
          else
            git commit -m "atlas395: record live Vercel audit"
            git push origin HEAD:atlas395-v0
          fi

      - name: Enforce canonical deployment health
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('morocco26/atlas395/vercel_audit_latest.json')
          if not p.exists():
              raise SystemExit('ATLAS395_VERCEL_AUDIT_MISSING')
          x=json.loads(p.read_text(encoding='utf-8'))
          canonical=next(a for a in x['aliases'] if a['url']==x['canonical_url'])
          print('CANONICAL_URL=',x['canonical_url'])
          print('CANONICAL_PASS=',x['canonical_pass'])
          print('ROOT_HTTP=',canonical['root']['status'])
          print('METHODOLOGY_HTTP=',canonical['data']['public_methodology.json']['status'])
          print('DAILY_ASSET_MATCH=',canonical['hash_match']['assets/daily.js'])
          print('METHODOLOGY_CONTRACT=',canonical['methodology_contract'])
          print('BROWSER=',canonical['browser'])
          if not x['canonical_pass']:
              raise SystemExit('ATLAS395_VERCEL_CANONICAL_FAIL')
          PY
