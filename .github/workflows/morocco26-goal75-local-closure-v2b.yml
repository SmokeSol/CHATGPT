name: morocco26-goal75-local-closure-v2b
on:
  push:
    branches: [morocco26-goal75-hard]
    paths:
      - 'morocco26/scripts/goal75_local_closure_v2b.py'
      - '.github/workflows/morocco26-goal75-local-closure-v2b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-goal75-hard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas openpyxl requests
      - run: PYTHONPATH=morocco26/scripts python morocco26/scripts/goal75_local_closure_v2b.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal75/local_92_closure_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "data(morocco26): record rigorous 92-local closure diagnostic"
            git pull --rebase origin morocco26-goal75-hard
            git push origin HEAD:morocco26-goal75-hard
          fi
