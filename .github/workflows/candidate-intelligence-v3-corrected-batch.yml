name: Candidate Intelligence V3 Corrected Symmetric Territorial Gate

on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/data/goal100/e_collect/candidate_intelligence_v3/candidate_intelligence_specification_audit_v1.json'
      - 'morocco26/data/goal100/e_collect/candidate_intelligence_v3/candidate_intelligence_v3_contract_v1.json'
      - 'morocco26/scripts/candidate_intelligence_v3_symmetric_territorial_gate.py'
      - '.github/workflows/candidate-intelligence-v3-corrected-batch.yml'
  workflow_dispatch:

concurrency:
  group: candidate-intelligence-v3-corrected-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  corrected-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy requests pandas pyarrow

      - name: Run corrected symmetric territorial diagnostic
        run: python morocco26/scripts/candidate_intelligence_v3_symmetric_territorial_gate.py

      - name: Show terminal certificate
        run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v3/candidate_intelligence_v3_terminal_certificate_v1.json

      - name: Persist one consolidated result commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v3/candidate_intelligence_v3_symmetric_territorial_gate_v1.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v3/candidate_intelligence_v3_terminal_certificate_v1.json
          git commit -m 'result(candidate-intel): record corrected symmetric V3 verdict' || exit 0
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
