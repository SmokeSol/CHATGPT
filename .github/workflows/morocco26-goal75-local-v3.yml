name: morocco26-goal75-local-v3
on:
  push:
    branches: [morocco26-goal75-hard]
    paths:
      - 'morocco26/scripts/goal75_local_closure_v3.py'
      - 'morocco26/data/local_exception_registered_2021_goal75.json'
      - '.github/workflows/morocco26-goal75-local-v3.yml'
permissions:
  contents: write
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas openpyxl requests
      - run: PYTHONPATH=morocco26/scripts python morocco26/scripts/goal75_local_closure_v3.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal75/local_92_closure_v3.json
          git commit -m 'data(morocco26): certify tiered 92-local closure v3' || true
          git pull --rebase origin morocco26-goal75-hard
          git push origin HEAD:morocco26-goal75-hard
