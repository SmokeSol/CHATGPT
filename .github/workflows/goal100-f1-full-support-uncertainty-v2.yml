name: Goal100 F1 full-support uncertainty V2
on:
  pull_request:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/data/goal100/f1_baseline_rebuild_contract_v2.json'
      - 'morocco26/scripts/goal100_f1_full_support_uncertainty_v2.py'
      - '.github/workflows/goal100-f1-full-support-uncertainty-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python morocco26/scripts/goal100_f1_full_support_uncertainty_v2.py
      - run: python -c "import json; d=json.load(open('morocco26/data/goal100/f1_full_support_uncertainty_dev_v2.json')); x=d['selected_candidate'] or d['best_near_miss']; print(json.dumps({'status':d['status'],'eligible_candidate_count':d['eligible_candidate_count'],'candidate_count':d['candidate_count'],'params':{k:x[k] for k in ['national_scale','national_isotropic_fraction','territorial_scale','territorial_pool_fraction']},'coverage_shortfall':x['selection_coverage_shortfall'],'calibration_error':x['selection_calibration_error'],'energy':x['selection_energy'],'width95':x['selection_width95']}, ensure_ascii=False))"
      - uses: actions/upload-artifact@v4
        with:
          name: f1-full-support-uncertainty-v2-results
          path: morocco26/data/goal100/f1_full_support_uncertainty_dev_v2.json
          if-no-files-found: error
