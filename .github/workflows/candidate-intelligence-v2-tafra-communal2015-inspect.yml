name: Candidate Intelligence V2 TAFRA Communal 2015 Inspect
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/inspect_tafra_communal2015_xlsx.py'
      - '.github/workflows/candidate-intelligence-v2-tafra-communal2015-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python morocco26/scripts/inspect_tafra_communal2015_xlsx.py
      - run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v2/tafra_communal2015_xlsx_inspection_v1.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/tafra_communal2015_xlsx_inspection_v1.json
          git commit -m 'analysis(candidate-intel): record TAFRA communal 2015 workbook schema' || exit 0
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
