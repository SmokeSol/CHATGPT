name: Candidate Intelligence V2 Local 2015 Unknown Diagnostic 2021
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_local2015_unknown_diagnostic_2021.py'
      - '.github/workflows/candidate-intelligence-v2-local2015-unknown-diagnostic-2021.yml'
  pull_request:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_closed_universe_trigger.txt'
      - 'morocco26/scripts/candidate_intelligence_v2_local2015_unknown_diagnostic_2021.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python morocco26/scripts/candidate_intelligence_v2_local2015_unknown_diagnostic_2021.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/2021/pjd_local2015_unknown_diagnostic_v1.json
          git commit -m 'analysis(candidate-intel): record 2021 local identity diagnostic' || exit 0
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
