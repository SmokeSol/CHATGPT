name: morocco26-goal75-final-v4b
on:
  push:
    branches: [morocco26-goal75-hard]
    paths:
      - 'morocco26/scripts/goal75_finalize_v4b.py'
      - '.github/workflows/morocco26-goal75-final-v4b.yml'
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas openpyxl requests
      - name: Machine Goal75 certification
        run: python morocco26/scripts/goal75_finalize_v4b.py
      - name: Anti-drift after state transition
        run: python morocco26/scripts/validate_anti_drift.py
      - name: Commit certified state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal75/scientific_completion_75.json morocco26/data/goal75/p5_live_decoder_v4.json morocco26/data/current_phase.json morocco26/data/execution_goal_75.json morocco26/reports/GOAL75_V4.md
          git commit -m 'milestone(morocco26): certify scientifically gated Goal75 v4b' || true
          git pull --rebase origin morocco26-goal75-hard
          git push origin HEAD:morocco26-goal75-hard
