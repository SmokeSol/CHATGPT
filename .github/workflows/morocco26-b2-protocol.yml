name: morocco26-b2-protocol

on:
  push:
    branches: [morocco26-b2]
    paths:
      - 'morocco26/data/goal100/b2_protocol_v1.json'
      - 'morocco26/data/goal100/b2_evidence_schema_v1.json'
      - 'morocco26/data/goal100/b2_feature_dictionary_v1.json'
      - 'morocco26/data/goal100/b2_gate_registry.json'
      - 'morocco26/data/goal100/b2_source_registry.json'
      - 'morocco26/data/goal100/b2_current_state.json'
      - 'morocco26/data/goal100/b2_freeze_certificate.json'
      - 'morocco26/data/goal100/b2_coefficients.json'
      - 'morocco26/data/goal100/b2_provenance_audit.json'
      - 'morocco26/data/goal100/b2_effect_calibration.json'
      - 'morocco26/data/goal100/forecast_registry.json'
      - 'morocco26/data/goal100/f0_registration_certificate.json'
      - 'morocco26/data/goal100/forecasts/F0/**'
      - 'morocco26/data/goal100/snapshots/F0/**'
      - 'morocco26/data/goal100/fil_ariane_events/A018.json'
      - 'morocco26/data/goal100/fil_ariane_events/A019.json'
      - 'morocco26/scripts/goal100_append_b2_ariane.py'
      - 'morocco26/scripts/goal100_append_b2_integration_fix.py'
      - 'morocco26/scripts/finalize_f0_hashes.py'
      - 'morocco26/scripts/validate_b2_protocol.py'
      - 'morocco26/scripts/validate_b2_post_f0.py'
      - 'morocco26/scripts/validate_registered_fminus1_post_squash.py'
      - 'morocco26/scripts/validate_goal100_tracking.py'
      - '.github/workflows/morocco26-b2-protocol.yml'
  workflow_dispatch:

concurrency:
  group: morocco26-b2-protocol-freeze
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  certify-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-b2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile B2 and registered-state validators
        run: |
          python -m py_compile \
            morocco26/scripts/goal100_append_b2_ariane.py \
            morocco26/scripts/goal100_append_b2_integration_fix.py \
            morocco26/scripts/finalize_f0_hashes.py \
            morocco26/scripts/validate_b2_protocol.py \
            morocco26/scripts/validate_b2_post_f0.py \
            morocco26/scripts/validate_registered_fminus1_post_squash.py \
            morocco26/scripts/validate_goal100_tracking.py

      - name: Append A018 and A019 to the canonical Ariane journal
        run: |
          python morocco26/scripts/goal100_append_b2_ariane.py
          python morocco26/scripts/goal100_append_b2_integration_fix.py

      - name: Finalize F0 integrity hashes when F0 exists
        run: |
          if [ -f morocco26/data/goal100/forecasts/F0/forecast.json ]; then
            python morocco26/scripts/finalize_f0_hashes.py
          fi

      - name: Validate frozen B2 protocol or post-F0 transition
        run: |
          if [ -f morocco26/data/goal100/forecasts/F0/forecast.json ]; then
            python morocco26/scripts/validate_b2_post_f0.py
          else
            python morocco26/scripts/validate_b2_protocol.py
          fi

      - name: Preserve registered F-1 and Goal75 anti-drift invariants
        run: |
          python morocco26/scripts/validate_goal100_tracking.py
          python morocco26/scripts/validate_anti_drift.py

      - name: Commit deterministic integrity finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+SmokeSol@users.noreply.github.com'
          git add \
            morocco26/FIL_ARIANE.md \
            morocco26/data/goal100/b2_effect_calibration.json \
            morocco26/data/goal100/b2_freeze_certificate.json \
            morocco26/data/goal100/b2_current_state.json \
            morocco26/data/goal100/forecast_registry.json \
            morocco26/data/goal100/f0_registration_certificate.json \
            morocco26/data/goal100/forecasts/F0 \
            morocco26/data/goal100/snapshots/F0
          if git diff --cached --quiet; then
            echo 'No deterministic integrity changes.'
            exit 0
          fi
          git commit -m 'integrity: finalize F0 hashes'
          git pull --rebase origin morocco26-b2
          git push origin HEAD:morocco26-b2
