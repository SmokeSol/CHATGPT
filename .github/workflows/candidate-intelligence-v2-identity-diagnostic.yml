name: Candidate Intelligence V2 Identity Diagnostic

on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_identity_diagnostic.py'
      - '.github/workflows/candidate-intelligence-v2-identity-diagnostic.yml'
  pull_request:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_identity_diag_trigger.txt'
      - 'morocco26/scripts/candidate_intelligence_v2_identity_diagnostic.py'
      - '.github/workflows/candidate-intelligence-v2-identity-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - run: python morocco26/scripts/candidate_intelligence_v2_identity_diagnostic.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/identity_diagnostic_v1.json
          git commit -m 'analysis(candidate-intel): record identity diagnostic' || exit 0
          git push origin HEAD:morocco26-e-reason
