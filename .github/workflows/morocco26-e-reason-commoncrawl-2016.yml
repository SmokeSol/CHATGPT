name: morocco26-e-reason-commoncrawl-2016
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_commoncrawl_2016_recovery.py"
      - ".github/workflows/morocco26-e-reason-commoncrawl-2016.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-commoncrawl-2016
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4
      - name: Recover 2016 records
        env:
          E_REASON_CC_RUN_ID: commoncrawl2016_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_commoncrawl_2016_recovery.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit recovered records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/commoncrawl_2016 morocco26/data/goal100/e_reason/commoncrawl_2016_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive Common Crawl 2016 recovery"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
