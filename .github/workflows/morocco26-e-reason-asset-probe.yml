name: morocco26-e-reason-asset-probe

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_probe_medias24_assets.py"
      - ".github/workflows/morocco26-e-reason-asset-probe.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-asset-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preregistration and ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Probe Médias24 historical assets
        env:
          E_REASON_ASSET_RUN_ID: medias24_asset_probe_${{ github.run_id }}_${{ github.run_attempt }}
          E_REASON_ASSET_MAX_FETCHES: "240"
        run: python morocco26/scripts/e_reason_probe_medias24_assets.py
      - name: Revalidate immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit probe artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/asset_probes \
                  morocco26/data/goal100/e_reason/medias24_asset_probe_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive Médias24 historical asset probe"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
