name: morocco26-goal75-stage1b
on:
  push:
    branches: [morocco26-goal75-hard]
    paths: ['.github/workflows/morocco26-goal75-stage1b.yml']
permissions:
  contents: write
jobs:
  acquire-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-goal75-hard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - name: Acquire all development outcomes while holdout 2021 stays sealed; freeze B/C
        run: python morocco26/scripts/goal75_stage1b.py
      - name: Commit Stage 1 evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal75
          git commit -m "data(morocco26): freeze robust Goal75 stage1 evidence"
          git push origin HEAD:morocco26-goal75-hard
