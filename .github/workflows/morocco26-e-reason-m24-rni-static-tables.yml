name: morocco26-e-reason-m24-rni-static-tables
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_recover_m24_rni_2016_static_tables.py"
      - ".github/workflows/morocco26-e-reason-m24-rni-static-tables.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-m24-rni-static-tables
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 pillow==11.3.0 pytesseract==0.3.13
      - name: Install OCR only for the two admissible static image tables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra
      - name: Recover versioned static assets and freeze OCR diagnostics
        env:
          E_REASON_M24_RNI_RUN_ID: m24_rni_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_recover_m24_rni_2016_static_tables.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit append-only static evidence and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/m24_rni_2016_static_tables \
                  morocco26/data/goal100/e_reason/m24_rni_2016_static_tables_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive versioned M24 RNI 2016 static tables"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
