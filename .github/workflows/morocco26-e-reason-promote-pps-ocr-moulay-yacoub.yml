name: morocco26-e-reason-promote-pps-ocr-moulay-yacoub
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_promote_pps_ocr_moulay_yacoub.py"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_final_two_page_ocr/diagnostic.json"
      - ".github/workflows/morocco26-e-reason-promote-pps-ocr-moulay-yacoub.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-promote-pps-ocr-moulay-yacoub
  cancel-in-progress: true
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_promote_pps_ocr_moulay_yacoub.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit fail-closed OCR evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pps_2016_ocr_moulay_yacoub/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze Moulay-Yacoub PPS OCR identities"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
