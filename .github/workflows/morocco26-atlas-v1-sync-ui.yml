name: morocco26-atlas-v1-sync-ui

on:
  workflow_dispatch:
  push:
    branches:
      - morocco26-e-collect
    paths:
      - 'morocco26/web/data/atlas_v1.json'
      - '.github/workflows/morocco26-atlas-v1-sync-ui.yml'

permissions:
  contents: write

concurrency:
  group: morocco26-atlas-v1-sync-ui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scientific/product source
        uses: actions/checkout@v4
        with:
          ref: morocco26-e-collect
          fetch-depth: 0
          path: source

      - name: Checkout deployed Atlas branch
        uses: actions/checkout@v4
        with:
          ref: atlas395-v0
          fetch-depth: 0
          path: target

      - name: Copy immutable Atlas V1 evidence snapshot
        run: |
          mkdir -p target/morocco26/web/data
          cp source/morocco26/web/data/atlas_v1.json target/morocco26/web/data/atlas_v1.json
          SOURCE_SHA=$(git -C source rev-parse HEAD)
          SOURCE_DATA_SHA=$(sha256sum source/morocco26/web/data/atlas_v1.json | awk '{print $1}')
          python - "$SOURCE_SHA" "$SOURCE_DATA_SHA" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          source_sha, data_sha = sys.argv[1:]
          payload = {
              'schema_version': '1.0',
              'source_branch': 'morocco26-e-collect',
              'source_commit_sha': source_sha,
              'atlas_v1_data_sha256': data_sha,
              'synced_at': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'forecast_snapshot': 'F0',
              'forecast_modified': False,
              'forecast_impact_status': 'NOT_CALIBRATED',
          }
          Path('target/morocco26/web/data/atlas_v1_meta.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Bust static asset caches for Atlas V1
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'target/morocco26/web/index.html': [
                  ('/styles.css?v=20260817-1710', '/styles.css?v=20260817-1848'),
                  ('/app.js?v=20260817-1710', '/app.js?v=20260817-1848'),
              ],
              'target/morocco26/web/app.js': [
                  ("const v='20260817-1758';", "const v='20260817-1848';"),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f'missing expected cache token in {name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate public data and UI wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('target/morocco26/web/data/atlas_v1.json').read_text(encoding='utf-8'))
          assert len(data['territories']) == 92
          assert len({t['constituency_id'] for t in data['territories']}) == 92
          assert data['coverage']['arabic_identity_coverage'] == 92
          assert data['coverage']['local_territories_with_records_after_merge'] == 92
          assert data['forecast']['immutable'] is True
          assert data['forecast']['candidate_and_signal_impact'] == 'NOT_CALIBRATED'
          app = Path('target/morocco26/web/app.js').read_text(encoding='utf-8')
          map_js = Path('target/morocco26/web/assets/map.js').read_text(encoding='utf-8')
          styles = Path('target/morocco26/web/styles.css').read_text(encoding='utf-8')
          candidates = Path('target/morocco26/web/assets/candidates.js').read_text(encoding='utf-8')
          assert "const v='20260817-1848';" in app
          assert '/assets/candidates.js?v=20260817-1848' in map_js
          assert '/assets/candidates.css?v=20260817-1848' in styles
          assert "load('atlas_v1.json')" in candidates
          print(json.dumps(data['coverage'], indent=2, ensure_ascii=False))
          PY

      - name: Commit and publish Atlas V1 UI data
        working-directory: target
        run: |
          if git diff --quiet -- morocco26/web && [ -z "$(git ls-files --others --exclude-standard morocco26/web)" ]; then
            echo 'Atlas V1 UI is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/web/data/atlas_v1.json \
                  morocco26/web/data/atlas_v1_meta.json \
                  morocco26/web/index.html \
                  morocco26/web/app.js
          git commit -m 'feat(atlas-v1): publish Arabic-native candidatures evidence layer'
          git push origin HEAD:atlas395-v0
