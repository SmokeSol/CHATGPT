name: morocco26-goal75-registered-national
on:
  push:
    branches: [morocco26-goal75-hard]
    paths: ['.github/workflows/morocco26-goal75-registered-national.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas requests lxml html5lib beautifulsoup4
      - run: PYTHONPATH=morocco26/scripts python morocco26/scripts/goal75_registered_national_audit.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f morocco26/data/goal75/registered_national_audit.json ]; then
            git add morocco26/data/goal75/registered_national_audit.json
            git commit -m "data(morocco26): record national registered-voter reconciliation" || true
            git pull --rebase origin morocco26-goal75-hard || true
            git push origin HEAD:morocco26-goal75-hard || true
          fi
