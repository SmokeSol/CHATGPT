name: Atlas 395 — Daily Intelligence & Publication

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

concurrency:
  group: atlas395-v05-daily-intelligence
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas395-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public election intelligence and publish Atlas edition
        run: bash morocco26/scripts/atlas395_daily_publish.sh
      - name: Check reader interface syntax
        shell: bash
        run: |
          # Keep py_compile bytecode outside the repository so the subsequent
          # product-only write-boundary check sees only actual product changes.
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/atlas395-pycache" python -m py_compile morocco26/scripts/atlas395_*.py
          node --check morocco26/web/app.js
          for f in morocco26/web/assets/*.js; do node --check "$f"; done
      - name: Enforce product-only write boundary
        shell: bash
        run: |
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^morocco26/(web/(data|editions)/|atlas395/intake/)' || true)"
          if [ -n "$bad" ]; then
            echo "Daily intelligence pipeline modified forbidden paths:"
            echo "$bad"
            exit 1
          fi
      - name: Commit intake archive and official daily edition
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- morocco26/atlas395/intake morocco26/web/data morocco26/web/editions)" ]; then
            echo "No daily product changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/atlas395/intake morocco26/web/data morocco26/web/editions
          git commit -m "atlas395: daily intelligence and edition $(TZ=Africa/Casablanca date +%F)"
          git push origin HEAD:atlas395-v0
