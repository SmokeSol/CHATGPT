name: Deploy Agent Society to GitHub Pages

on:
  push:
    branches:
      - morocco26-agent-society-v2-front-vote-llm
    paths:
      - 'morocco26/frontends/agent_society_opus/source_v2/web/**'
      - '.github/workflows/deploy-agent-society-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agent-society-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Agent Society branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Agent Society static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: morocco26/frontends/agent_society_opus/source_v2/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
