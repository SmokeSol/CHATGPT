name: Morocco26 Agent Society V2 population feasibility audit

on:
  pull_request:
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/population_feasibility.trigger'
      - 'morocco26/scripts/agent_society_v2_population_feasibility_audit.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b9859957c19d545a625053808c33829d06c34a2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 openpyxl==3.1.5 numpy==2.1.3
      - run: python morocco26/scripts/agent_society_v2_population_feasibility_audit.py
      - run: cat morocco26/data/goal100/agent_society_v2/population_feasibility_audit_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-society-v2-population-feasibility
          path: morocco26/data/goal100/agent_society_v2/population_feasibility_audit_v1.json
