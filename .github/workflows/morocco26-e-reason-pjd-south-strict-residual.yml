name: morocco26-e-reason-pjd-south-strict-residual
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_certify_and_extract_pjd_south_2016_strict_residual.py"
      - ".github/workflows/morocco26-e-reason-pjd-south-strict-residual.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-pjd-south-strict-residual
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_certify_and_extract_pjd_south_2016_strict_residual.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit certificate and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/strict_2016_pjd_south_residual/certificate.json \
                  morocco26/data/goal100/e_reason/evidence/strict_2016_pjd_south_residual/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze certified PJD south strict residual evidence"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
