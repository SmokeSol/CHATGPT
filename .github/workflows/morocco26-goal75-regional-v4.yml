name: morocco26-goal75-regional-v4
on:
  push:
    branches: [morocco26-goal75-hard]
    paths:
      - 'morocco26/scripts/goal75_regional_graph_v4.py'
      - '.github/workflows/morocco26-goal75-regional-v4.yml'
permissions:
  contents: write
jobs:
  regional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python morocco26/scripts/goal75_regional_graph_v4.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal75/regional_graph_v4.json
          git commit -m 'data(morocco26): certify regional empirical graph v4' || true
          git pull --rebase origin morocco26-goal75-hard
          git push origin HEAD:morocco26-goal75-hard
