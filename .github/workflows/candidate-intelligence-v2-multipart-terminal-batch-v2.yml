name: Candidate Intelligence V2 Multipart Terminal Batch V2
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2021_m1_identity_resolution_v1.json'
      - 'morocco26/scripts/candidate_intelligence_v2_multipart_head_power_gate_v4.py'
      - 'morocco26/scripts/candidate_intelligence_v2_multipart_predictive_gate_v2.py'
      - 'morocco26/scripts/candidate_intelligence_v2_terminal_certificate_v2.py'
      - '.github/workflows/candidate-intelligence-v2-multipart-terminal-batch-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy requests pandas pyarrow
      - run: python morocco26/scripts/candidate_intelligence_v2_multipart_head_power_gate_v4.py
      - run: python morocco26/scripts/candidate_intelligence_v2_multipart_predictive_gate_v2.py
      - run: python morocco26/scripts/candidate_intelligence_v2_terminal_certificate_v2.py
      - run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_terminal_certificate_v2.json
      - name: Commit final batch results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_multipart_head_power_gate_v4.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2016_head_prior_mp_features_v4.jsonl
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2021_head_prior_mp_features_v4.jsonl
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/multipart/2021_head_roster_dedup_v4.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_multipart_predictive_gate_v2.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_terminal_certificate_v2.json
          git commit -m 'result(candidate-intel): finalize audited multipart V2 verdict' || exit 0
          for i in 1 2 3; do git pull --rebase origin morocco26-e-reason && git push origin HEAD:morocco26-e-reason && exit 0; sleep 5; done
          exit 1
