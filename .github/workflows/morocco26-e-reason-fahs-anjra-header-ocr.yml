name: morocco26-e-reason-fahs-anjra-header-ocr
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_ocr_fahs_anjra_header_variants.py"
      - ".github/workflows/morocco26-e-reason-fahs-anjra-header-ocr.yml"
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.3 pillow==11.3.0 pytesseract==0.3.13
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara
      - run: python morocco26/scripts/e_reason_ocr_fahs_anjra_header_variants.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/strict_2016_fahs_anjra_header_ocr/diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze robust Fahs-Anjra header OCR diagnostic"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
