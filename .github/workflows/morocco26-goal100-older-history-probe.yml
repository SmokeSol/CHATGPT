name: morocco26-goal100-older-history-probe
on:
  push:
    branches: [morocco26-goal100-p0]
    paths:
      - 'morocco26/scripts/goal100_probe_older_history.py'
      - '.github/workflows/morocco26-goal100-older-history-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal100-p0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas openpyxl requests
      - name: Probe older TAFRA workbooks
        run: python morocco26/scripts/goal100_probe_older_history.py
      - name: Commit immutable probe artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/older_history_probe
          git commit -m 'data(morocco26): probe 2002/2007 history for Goal100' || true
          git pull --rebase origin morocco26-goal100-p0
          git push origin HEAD:morocco26-goal100-p0
