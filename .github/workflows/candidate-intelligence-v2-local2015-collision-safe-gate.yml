name: Candidate Intelligence V2 Local 2015 Collision Safe Gate
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_local2015_collision_safe_gate.py'
      - '.github/workflows/candidate-intelligence-v2-local2015-collision-safe-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python morocco26/scripts/candidate_intelligence_v2_local2015_collision_safe_gate.py
      - run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_local2015_collision_safe_gate_v1.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/candidate_intelligence_v2_local2015_collision_safe_gate_v1.json
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/2016/pjd_local2015_collision_safe_v1.jsonl
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/2021/pjd_local2015_collision_safe_v1.jsonl
          git commit -m 'gate(candidate-intel): record collision-safe local-council power audit' || exit 0
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
