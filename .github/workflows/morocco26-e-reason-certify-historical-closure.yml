name: morocco26-e-reason-certify-historical-closure
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_certify_historical_collection_closure.py"
      - "morocco26/data/goal100/e_reason/evidence/strict_2016_integrity_gate/gate.json"
      - "morocco26/data/goal100/e_reason/evidence/2021_head_list_rank_enrichment/gate.json"
      - ".github/workflows/morocco26-e-reason-certify-historical-closure.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-certify-historical-closure
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_certify_historical_collection_closure.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit collection closure certificate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/historical_collection_closure/certificate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze historical collection closure certificate"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
