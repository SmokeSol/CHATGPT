name: Vercel public protection probe

on:
  push:
    branches: [atlas395-v0]
    paths: ['.github/workflows/vercel-public-protection-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public test deployment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://atlas-395-public-test-yannlevy85gmailcoms-projects.vercel.app/'
          code=$(curl -sS -L -o /tmp/body.html -w '%{http_code}' --max-time 40 "$URL")
          bytes=$(wc -c < /tmp/body.html)
          title=$(python - <<'PY'
          import re
          text=open('/tmp/body.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
          print((m.group(1).strip() if m else 'NO_TITLE')[:200])
          PY
          )
          echo "HTTP=$code BYTES=$bytes TITLE=$title"
          if grep -Fq 'ATLAS395_PUBLIC_PROTECTION_DISABLED' /tmp/body.html; then
            echo 'PUBLIC_PROTECTION_DISABLED=YES'
            exit 0
          fi
          echo 'PUBLIC_PROTECTION_DISABLED=NO'
          python - <<'PY'
          import re
          text=open('/tmp/body.html',encoding='utf-8',errors='replace').read()
          for pattern in ['Vercel Authentication','Log in','Sign In','sso','deployment protection']:
              if re.search(pattern,text,re.I): print('BODY_MARKER='+pattern)
          PY
          exit 1
