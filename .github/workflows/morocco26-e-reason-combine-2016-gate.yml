name: morocco26-e-reason-combine-2016-gate
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_combine_2016_candidate_evidence.py"
      - "morocco26/scripts/e_reason_summarize_2016_residual.py"
      - "morocco26/data/goal100/e_reason/evidence/pjd_2016_parsed_slates/parsed_slates.json"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_typographic_identities/parsed_identities.json"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_direct_typographic_extension/extension.json"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_ocr_moulay_yacoub/evidence.json"
      - "morocco26/data/goal100/e_reason/evidence/pps_2016_parsed_missing_slates/parsed_missing_slates.json"
      - ".github/workflows/morocco26-e-reason-combine-2016-gate.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-combine-2016-gate
  cancel-in-progress: true
jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python morocco26/scripts/e_reason_combine_2016_candidate_evidence.py
      - run: python morocco26/scripts/e_reason_summarize_2016_residual.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit combined gate and residual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/combined_2016_candidate_gate/gate.json \
                  morocco26/data/goal100/e_reason/evidence/combined_2016_candidate_gate/residual.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze combined 2016 candidate gate"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
