name: Morocco26 E_reason Opus5 sealed handoff

on:
  pull_request:
    branches:
      - morocco26-e-reason
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen scientific branch
        uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0

      - name: Install frozen runtime dependency
        run: python -m pip install --disable-pip-version-check --quiet numpy

      - name: Build blinded 2021 holdout if absent
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          if test -f morocco26/data/goal100/e_reason/blind/holdout/bundle_manifest.json; then
            python morocco26/scripts/e_reason_holdout_2021_ci_driver.py build --secret-path "$RUNNER_TEMP/e_reason_holdout_secret/holdout_mapping.json"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/e_reason_holdout_secret"
            python morocco26/scripts/e_reason_holdout_2021_ci_driver.py build --secret-path "$RUNNER_TEMP/e_reason_holdout_secret/holdout_mapping.json"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sealed holdout mapping
        if: steps.bundle.outputs.built == 'true'
        id: map_upload
        uses: actions/upload-artifact@v4
        with:
          name: e-reason-holdout-secret-mapping
          path: ${{ runner.temp }}/e_reason_holdout_secret/holdout_mapping.json
          retention-days: 90
          if-no-files-found: error

      - name: Freeze blinded holdout packets in Git
        if: steps.bundle.outputs.built == 'true'
        env:
          MAP_ARTIFACT_ID: ${{ steps.map_upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python morocco26/scripts/e_reason_holdout_2021_ci_driver.py locator --artifact-id "$MAP_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_reason/blind/holdout/
          git diff --cached --check
          git commit -m 'experiment(e-reason): freeze blinded holdout packets before judgments'
          git fetch origin morocco26-e-reason
          git rebase origin/morocco26-e-reason
          git push origin HEAD:morocco26-e-reason

      - name: Generate C1 holdout if absent
        id: c1
        shell: bash
        run: |
          set -euo pipefail
          if test -f morocco26/data/goal100/e_reason/judgments/holdout/c1_rule_only/c1_judgment_manifest.json; then
            python morocco26/scripts/e_reason_holdout_2021_ci_driver.py c1
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            python morocco26/scripts/e_reason_holdout_2021_ci_driver.py c1
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze C1 holdout judgments in Git
        if: steps.c1.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_reason/judgments/holdout/c1_rule_only/
          git diff --cached --check
          git commit -m 'experiment(e-reason): freeze deterministic C1 holdout judgments'
          git fetch origin morocco26-e-reason
          git rebase origin/morocco26-e-reason
          git push origin HEAD:morocco26-e-reason

      - name: Build hermetic Opus5 2021 handoff
        run: |
          set -euo pipefail
          python morocco26/scripts/e_reason_holdout_2021_ci_driver.py handoff --out "$RUNNER_TEMP/opus5_e_reason_c2_holdout_handoff"

      - name: Upload sealed Opus5 2021 handoff
        id: opus_upload
        uses: actions/upload-artifact@v4
        with:
          name: opus5-e-reason-c2-holdout-sealed-handoff
          path: ${{ runner.temp }}/opus5_e_reason_c2_holdout_handoff
          retention-days: 90
          if-no-files-found: error

      - name: Report handoff artifact
        run: echo "OPUS5_HOLDOUT_ARTIFACT_ID=${{ steps.opus_upload.outputs.artifact-id }}"
