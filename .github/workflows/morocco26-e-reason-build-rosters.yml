name: morocco26-e-reason-build-rosters

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_build_historical_rosters.py"
      - "morocco26/scripts/e_reason_build_historical_rosters_retry_runner.py"
      - ".github/workflows/morocco26-e-reason-build-rosters.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-build-rosters
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preregistration and immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Recover and parse historical rosters with transport retries
        env:
          E_REASON_ROSTER_RUN_ID: historical_rosters_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_build_historical_rosters_retry_runner.py
      - name: Revalidate immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit append-only roster evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/historical_rosters \
                  morocco26/data/goal100/e_reason/historical_rosters_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze recovered historical rosters and gate"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
