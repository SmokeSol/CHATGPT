name: morocco26-goal75-local-interval-proof
on:
  push:
    branches: [morocco26-goal75-hard]
    paths: ['.github/workflows/morocco26-goal75-local-interval-proof.yml']
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-goal75-hard}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pandas openpyxl requests
      - run: python morocco26/scripts/goal75_local_allocation_interval_proof.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f morocco26/data/goal75/local_allocation_interval_proof.json ]; then
            git add morocco26/data/goal75/local_allocation_interval_proof.json
            git commit -m "data(morocco26): record exact local interval allocation proof" || true
            git pull --rebase origin morocco26-goal75-hard || true
            git push origin HEAD:morocco26-goal75-hard || true
          fi
