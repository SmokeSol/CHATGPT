name: Atlas 395 — Public host probe

on:
  push:
    branches: [atlas395-v0]
    paths:
      - '.github/workflows/atlas395-host-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate public hosts in headless Chrome
        shell: bash
        run: |
          set -uo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 2
          candidates=(
            'https://rawcdn.githack.com/SmokeSol/CHATGPT/02aa2e33927b665b274fb4fde7d01d42bc1cbc4e/morocco26/web/githack.html'
            'https://rawcdn.githack.com/SmokeSol/CHATGPT/atlas395-v0/morocco26/web/githack.html'
            'https://cdn.jsdelivr.net/gh/SmokeSol/CHATGPT@atlas395-v0/morocco26/web/githack.html'
            'https://cdn.statically.io/gh/SmokeSol/CHATGPT/atlas395-v0/morocco26/web/githack.html'
          )
          found=''
          n=0
          for url in "${candidates[@]}"; do
            n=$((n+1))
            echo "=== PROBE $n: $url ==="
            curl -fsSIL --max-time 20 "$url" | sed -n '1,12p' || true
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$url" > "/tmp/dom$n.html" 2>"/tmp/chrome$n.log" || true
            echo "DOM_BYTES=$(wc -c < /tmp/dom$n.html)"
            title=$(grep -o '<title>[^<]*' "/tmp/dom$n.html" | head -1 || true)
            echo "TITLE=$title"
            if grep -Fq 'Synthèse nationale' "/tmp/dom$n.html" \
              && grep -Fq 'Méthodologie' "/tmp/dom$n.html" \
              && grep -Fq 'Carte territoriale' "/tmp/dom$n.html" \
              && grep -Fq 'class="kpi hi"' "/tmp/dom$n.html" \
              && ! grep -Fq 'External Content Notice' "/tmp/dom$n.html"; then
              echo "SUCCESS_URL=$url"
              found="$url"
              break
            fi
            echo "NOT_USABLE"
            tail -20 "/tmp/chrome$n.log" || true
          done
          test -n "$found"
