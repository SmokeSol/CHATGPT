name: Test Agent Society ChatGPT-account baseline runner

on:
  push:
    branches:
      - morocco26-agent-society-v2-front-vote-llm
    paths:
      - 'morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/**'
      - 'morocco26/frontends/agent_society_opus/source_v2/web/g0-reference.js'
      - 'morocco26/frontends/agent_society_opus/source_v2/web/social.js'
      - 'morocco26/frontends/agent_society_opus/source_v2/web/data/reference_provenance.json'
      - '.github/workflows/test-agent-society-chatgpt-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python pipelines
        run: |
          python -m py_compile \
            morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/run_chatgpt_baseline.py \
            morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/promote_g0_frontend.py
      - name: Check browser JavaScript syntax
        run: |
          node --check morocco26/frontends/agent_society_opus/source_v2/web/g0-reference.js
          node --check morocco26/frontends/agent_society_opus/source_v2/web/social.js
          node --check morocco26/frontends/agent_society_opus/source_v2/web/abuse.js
      - name: Run contract tests
        run: >-
          python -m unittest discover -v
          -s morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/tests
          -p 'test_*.py'
