name: morocco26-e-reason-pjd-2016-candidate-discovery

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_discover_pjd_2016_candidate_documents.py"
      - ".github/workflows/morocco26-e-reason-pjd-2016-candidate-discovery.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-pjd-2016-candidate-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Inventory PJD 2016 candidate posts and attachments
        env:
          E_REASON_PJD_DISCOVERY_RUN_ID: pjd2016_discovery_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_discover_pjd_2016_candidate_documents.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit discovery-only inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pjd_2016_candidate_discovery \
                  morocco26/data/goal100/e_reason/pjd_2016_candidate_discovery_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive PJD 2016 candidate-document inventory"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
