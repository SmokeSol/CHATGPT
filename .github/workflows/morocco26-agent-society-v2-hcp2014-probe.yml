name: Morocco26 Agent Society V2 HCP 2014 probe

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/triggers/hcp2014_probe.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-agent-society-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 openpyxl==3.1.5
      - name: Probe official HCP RGPH 2014 workbooks
        run: python morocco26/scripts/agent_society_v2_hcp2014_probe.py
      - name: Show compact result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('morocco26/data/goal100/agent_society_v2/probes/hcp2014/probe.json',encoding='utf-8'))
          print(json.dumps({
            'workbooks_valid':p['workbooks_valid'],
            'required_theme_presence':p['required_theme_presence'],
            'files':[{k:f.get(k) for k in ('name','bytes','sha256','sheet_names','token_hits')} for f in p['files']],
            'errors':p['errors'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-hcp2014-probe
          path: morocco26/data/goal100/agent_society_v2/probes/hcp2014/probe.json
