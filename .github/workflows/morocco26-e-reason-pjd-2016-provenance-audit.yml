name: morocco26-e-reason-pjd-2016-provenance-audit

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_audit_pjd_2016_provenance.py"
      - ".github/workflows/morocco26-e-reason-pjd-2016-provenance-audit.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-pjd-2016-provenance-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 pypdf==5.9.0
      - name: Audit migrated official-party document provenance
        run: python morocco26/scripts/e_reason_audit_pjd_2016_provenance.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit provenance audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pjd_2016_provenance_audit/audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze PJD 2016 provenance audit"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
