# operational retrigger 2026-08-19; no model/protocol change
name: Goal100 F1 conventional baseline rebuild V1
on:
  push:
    branches: [morocco26-e-reason]
    paths:
      - 'morocco26/data/goal100/f1_baseline_rebuild_contract_v1.json'
      - 'morocco26/scripts/goal100_f1_baseline_rebuild_v1.py'
      - '.github/workflows/goal100-f1-baseline-rebuild-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python morocco26/scripts/goal100_f1_baseline_rebuild_v1.py
      - run: cat morocco26/data/goal100/f1_baseline_preflight_result_v1.json
      - run: python -c "import json; d=json.load(open('morocco26/data/goal100/f1_hierarchical_uncertainty_dev_v1.json')); print(json.dumps({'status':d['status'],'eligible_candidate_count':d['eligible_candidate_count'],'selected_candidate':d['selected_candidate']}, ensure_ascii=False))"
      - uses: actions/upload-artifact@v4
        with:
          name: f1-baseline-rebuild-v1-results
          path: |
            morocco26/data/goal100/f1_baseline_preflight_result_v1.json
            morocco26/data/goal100/f1_hierarchical_uncertainty_dev_v1.json
          if-no-files-found: error
