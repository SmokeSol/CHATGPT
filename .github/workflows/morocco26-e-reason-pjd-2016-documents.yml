name: morocco26-e-reason-pjd-2016-documents

on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_collect_pjd_2016_documents.py"
      - "morocco26/data/goal100/e_reason/e_reason_source_registry_v1.json"
      - ".github/workflows/morocco26-e-reason-pjd-2016-documents.yml"

permissions:
  contents: write

concurrency:
  group: morocco26-e-reason-pjd-2016-documents
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preregistration and immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 pypdf==5.9.0
      - name: Recover official PJD 2016 slate documents
        env:
          E_REASON_PJD2016_RUN_ID: pjd2016_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/e_reason_collect_pjd_2016_documents.py
      - name: Revalidate immutable ancestry
        run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit append-only PJD evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pjd_2016_documents \
                  morocco26/data/goal100/e_reason/pjd_2016_documents_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): archive PJD 2016 slate documents"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
