name: morocco26-install-b2-source-watch

on:
  push:
    branches: [morocco26-fminus1-run]
    paths:
      - 'morocco26/scripts/goal100_install_b2_source_watch.py'
      - '.github/workflows/morocco26-install-b2-source-watch.yml'
  workflow_dispatch:

concurrency:
  group: morocco26-install-b2-source-watch-v1
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      B2_BRANCH: morocco26-b2-structured-evidence
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for B2 branch and checkout
        run: |
          for attempt in $(seq 1 40); do
            git fetch origin --prune
            if git ls-remote --exit-code --heads origin "$B2_BRANCH" >/dev/null 2>&1; then
              git switch -C "$B2_BRANCH" "origin/$B2_BRANCH"
              exit 0
            fi
            echo "Waiting for B2 bootstrap: $attempt/40"
            sleep 10
          done
          exit 1

      - name: Import source-watch installer
        run: git checkout origin/morocco26-fminus1-run -- morocco26/scripts/goal100_install_b2_source_watch.py

      - name: Install source registry and append-only watch
        run: python morocco26/scripts/goal100_install_b2_source_watch.py

      - name: Validate and execute first acquisition snapshot
        run: |
          pip install --quiet requests
          python morocco26/scripts/validate_anti_drift.py
          python morocco26/scripts/goal100_validate_b2_v1.py
          python morocco26/scripts/goal100_b2_source_watch.py
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('morocco26/data/goal100/b2/v1/source_watch').glob('*.json'))
          assert files
          report=json.loads(files[-1].read_text(encoding='utf-8'))
          assert report['gate']=='PASS_ACQUISITION_METADATA_ONLY'
          assert report['evidence_rows_created']==0
          assert report['interpretation_performed'] is False
          assert len(report['sources'])>=5
          print('B2_FIRST_SOURCE_WATCH_PASS',files[-1])
          PY

      - name: Commit source watch installation and first snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            morocco26/data/goal100/b2/v1 \
            morocco26/scripts/goal100_install_b2_source_watch.py \
            morocco26/scripts/goal100_b2_source_watch.py \
            .github/workflows/morocco26-b2-source-watch.yml \
            morocco26/FIL_D_ARIANE.md \
            morocco26/FIL_ARIANE.md 2>/dev/null || true
          git commit -m 'feat(morocco26): install official B2 source watch and first acquisition snapshot' || true
          git push origin HEAD:"$B2_BRANCH"

      - name: Print status
        run: |
          cat morocco26/data/goal100/b2/v1/source_watch_installation_status.json
          ls -1t morocco26/data/goal100/b2/v1/source_watch/*.json | head -1 | xargs cat
