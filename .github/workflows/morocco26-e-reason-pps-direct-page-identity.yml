name: morocco26-e-reason-pps-direct-page-identity
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_map_pps_2016_direct_page_identities.py"
      - "morocco26/data/goal100/e_reason/pps_2016_regional_pdf_probe_latest.json"
      - ".github/workflows/morocco26-e-reason-pps-direct-page-identity.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-pps-direct-page-identity
  cancel-in-progress: true
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pdfplumber==0.11.7 pypdf==5.9.0
      - name: Map direct first-party poster title identities with persisted diagnostics
        run: |
          mkdir -p morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag
          set +e
          python -m py_compile morocco26/scripts/e_reason_map_pps_2016_direct_page_identities.py \
            > morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/compile_stdout.txt \
            2> morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/compile_stderr.txt
          COMPILE_RC=$?
          echo "$COMPILE_RC" > morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/compile_exit_code.txt
          if [ "$COMPILE_RC" -eq 0 ]; then
            python morocco26/scripts/e_reason_map_pps_2016_direct_page_identities.py \
              > morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/run_stdout.txt \
              2> morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/run_stderr.txt
            RUN_RC=$?
          else
            RUN_RC=98
          fi
          echo "$RUN_RC" > morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag/run_exit_code.txt
          set -e
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit direct identity map or failure diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity_workflow_diag
          if [ -f morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity/direct_map.json ]; then
            git add morocco26/data/goal100/e_reason/evidence/pps_2016_direct_page_identity/direct_map.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze direct PPS page-title identity map diagnostic"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
