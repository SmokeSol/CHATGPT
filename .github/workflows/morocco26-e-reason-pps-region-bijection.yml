name: morocco26-e-reason-pps-region-bijection
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_assign_pps_pages_by_region_bijection.py"
      - "morocco26/data/goal100/e_reason/pps_2016_regional_pdf_probe_latest.json"
      - ".github/workflows/morocco26-e-reason-pps-region-bijection.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-pps-region-bijection
  cancel-in-progress: true
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Solve region-bounded 92-page identity bijection
        run: python morocco26/scripts/e_reason_assign_pps_pages_by_region_bijection.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit identity-only bijection diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pps_2016_region_bijection/bijection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze PPS regional page identity bijection"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
