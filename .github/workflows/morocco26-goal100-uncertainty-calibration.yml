name: morocco26-goal100-uncertainty-calibration

on:
  push:
    branches: [morocco26-fminus1]
    paths:
      - 'morocco26/data/goal100/uncertainty_protocol_v1.json'
      - 'morocco26/scripts/goal100_fit_uncertainty.py'
      - 'morocco26/data/goal100/historical/**'
      - 'morocco26/data/goal75/local_92_closure_v3.json'
      - 'morocco26/data/goal100/bstar_hindcast_v1.json'
      - '.github/workflows/morocco26-goal100-uncertainty-calibration.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-fminus1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy
      - name: Fit and calibrate hierarchical uncertainty
        run: python morocco26/scripts/goal100_fit_uncertainty.py
      - name: Preserve Goal75 anti-drift checkpoint
        run: python morocco26/scripts/validate_anti_drift.py
      - name: Commit calibration artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+SmokeSol@users.noreply.github.com'
          git add morocco26/data/goal100/uncertainty_calibration.json
          git commit -m 'data(morocco26): calibrate hierarchical uncertainty' || true
          git pull --rebase origin morocco26-fminus1
          git push origin HEAD:morocco26-fminus1
