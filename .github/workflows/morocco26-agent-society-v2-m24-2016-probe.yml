name: Morocco26 Agent Society V2 M24 2016 probe

on:
  pull_request:
    branches: [morocco26-agent-society-v2]
    paths:
      - 'morocco26/data/goal100/agent_society_v2/probe.trigger'
      - '.github/workflows/morocco26-agent-society-v2-m24-2016-probe.yml'
      - 'morocco26/scripts/agent_society_v2_m24_2016_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-agent-society-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4
      - name: Probe frozen pre-election 2016 interactive assets
        env:
          ASV2_RUN_ID: asv2_m24_2016_${{ github.run_id }}_${{ github.run_attempt }}
        run: python morocco26/scripts/agent_society_v2_m24_2016_probe.py
      - name: Show summary
        run: cat morocco26/data/goal100/agent_society_v2/probes/m24_2016/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: asv2-m24-2016-probe
          path: morocco26/data/goal100/agent_society_v2/probes/m24_2016
          if-no-files-found: error
