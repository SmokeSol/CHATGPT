name: morocco26-e-reason-parse-pps-2016-missing-slates
on:
  workflow_dispatch:
  push:
    branches: [morocco26-e-reason]
    paths:
      - "morocco26/scripts/e_reason_parse_pps_2016_missing_slates.py"
      - ".github/workflows/morocco26-e-reason-parse-pps-2016-missing-slates.yml"
permissions:
  contents: write
concurrency:
  group: morocco26-e-reason-parse-pps-2016-missing-slates
  cancel-in-progress: true
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: morocco26-e-reason, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - run: python -m pip install --disable-pip-version-check pdfplumber==0.11.7 pypdf==5.9.0
      - run: python morocco26/scripts/e_reason_parse_pps_2016_missing_slates.py
      - run: python morocco26/scripts/validate_e_reason_prereg.py
      - name: Commit parsed PPS evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco26/data/goal100/e_reason/evidence/pps_2016_parsed_missing_slates/parsed_missing_slates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment(e-reason): freeze PPS identities for missing 2016 districts"
          git pull --rebase origin morocco26-e-reason
          git push origin HEAD:morocco26-e-reason
