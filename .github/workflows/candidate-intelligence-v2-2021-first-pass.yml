name: Candidate Intelligence V2 2021 First Pass

on:
  push:
    branches:
      - morocco26-e-reason
    paths:
      - 'morocco26/scripts/candidate_intelligence_v2_recover_2021.py'
      - '.github/workflows/candidate-intelligence-v2-2021-first-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: morocco26-e-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recover 2021 candidate intelligence
        run: python morocco26/scripts/candidate_intelligence_v2_recover_2021.py
      - name: Show audit
        run: cat morocco26/data/goal100/e_collect/candidate_intelligence_v2/2021/power_audit_first_pass.json
      - name: Commit append-only recovery artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morocco26/data/goal100/e_collect/candidate_intelligence_v2/2021
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data(candidate-intel): recover 2021 first-pass panel'
            git push origin HEAD:morocco26-e-reason
          fi

